<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Realm Arbitrage</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script>
  // Runs before first paint, deliberately separate from the main script at
  // the end of body -- setting the theme attribute after CSS has already
  // rendered would show a flash of the wrong theme. Saved choice wins over
  // the system preference (that's the point of a manual toggle); the
  // system preference is only the fallback for a first-ever visit.
  (function () {
    var saved = localStorage.getItem("theme");
    var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
  :root {
    color-scheme: light;
    /* "Assay ledger" palette -- a certified commodities statement on paper,
       not a hacker terminal. Cooler near-white (not warm cream) and a
       muted metallic gold/verdigris pairing keep it from reading as the
       generic "cream + serif + terracotta" AI-dashboard default. */
    --paper: #f6f7f5;
    --card: #ffffff;
    --hairline: #d8dbd4;
    --hairline-strong: #c3c8bd;
    --ink: #14161a;
    --text-dim: #5b6259;
    --bullion: #a67c2e;       /* signature accent -- literal tie to "gold prices" */
    --bullion-dim: #8a6624;
    --verified: #2f7d72;      /* Validation Seal + "fresh/ok" states only */
    --verified-bg: rgba(47,125,114,0.08);
    --alert: #b0392f;
    --alert-bg: rgba(176,57,47,0.08);
    --coin-gold: #d4af37; --coin-silver: #b7b7b7; --coin-copper: #b87333;
  }
  /* Same "assay ledger" identity, same-thesis dark variant -- not a
     different theme, the same certificate under gallery lighting. Applied
     via a data-theme attribute (see the theme-toggle script) rather than
     a bare prefers-color-scheme media query, since the toggle needs to be
     able to override the system preference either direction and persist
     the choice. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #14161a;
    --card: #1b1e24;
    --hairline: #333844;
    --hairline-strong: #454b59;
    --ink: #e8eaed;
    --text-dim: #8b93a3;
    --bullion: #d4af61;
    --bullion-dim: #b8934f;
    --verified: #3fa9a0;
    --verified-bg: rgba(63,169,160,0.14);
    --alert: #e0645a;
    --alert-bg: rgba(224,100,90,0.14);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: var(--paper); color: var(--ink);
  }
  code, .mono, .money, .num { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; padding: 1rem 1.5rem; background: var(--card);
    border-bottom: 1px solid var(--hairline-strong);
  }
  .brand { display: flex; align-items: center; gap: 0.6rem; }
  /* display: contents -- the link itself takes no box in the flex layout,
     so wrapping the seal+wordmark in an <a> doesn't disturb .brand's
     existing flex/gap; only the svg and h1 participate in that layout. */
  .brand-link { display: contents; text-decoration: none; color: inherit; }
  .brand h1 {
    font-size: 1.05rem; margin: 0; font-weight: 800; letter-spacing: -0.01em;
    text-transform: uppercase; color: var(--ink);
  }
  /* Signature element: a hairline stamp mark, like an assay/bullion
     certification seal -- encodes the product's actual thesis (validated
     data, not just cheap listings), not decoration. One per page, not one
     per row -- a certificate has a single seal. */
  .seal { color: var(--verified); flex-shrink: 0; }
  .nav { display: flex; gap: 0.4rem; align-items: center; }
  .nav a, .nav button {
    background: transparent; border: 1px solid transparent; color: var(--text-dim);
    border-radius: 4px; padding: 0.45rem 0.8rem; cursor: pointer; font-size: 0.8rem;
    text-decoration: none; font-weight: 600; font-family: inherit;
    transition: background-color 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .nav a:hover, .nav button:hover { background: var(--paper); border-color: var(--hairline-strong); color: var(--ink); }
  /* The current page's own nav link -- shown, not omitted, so the nav's set
     of items (and therefore its width/layout) never changes page to page;
     an omitted self-link used to make the whole bar visibly shift depending
     on which page you were on (2026-07-30 human report). */
  .nav a.active { color: var(--bullion); font-weight: 700; cursor: default; }
  .nav a.active:hover { background: transparent; border-color: transparent; }
  #theme-toggle { font-size: 1rem; line-height: 1; padding: 0.45rem 0.6rem; }

  /* ---------- Shell: filter rail + content ---------- */
  .shell { display: flex; align-items: flex-start; gap: 1.25rem; padding: 1.25rem 1.5rem; max-width: 1500px; margin-inline: auto; }
  .filters {
    flex: 0 0 15rem; background: var(--card); border: 1px solid var(--hairline);
    border-radius: 6px; padding: 0.85rem; display: flex; flex-direction: column; gap: 0.55rem;
  }
  /* Paired numeric inputs (min/max, etc.) side by side instead of stacked --
     added 2026-07-26 so the whole rail fits one viewport without scrolling. */
  /* align-items: end -- a longer label (e.g. "Min sell price (g)") can wrap
     to two lines while its row partner ("Max per item") stays on one; without
     this the two inputs sit at different heights instead of sharing a
     baseline. */
  .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; align-items: end; }
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.9rem; }

  /* Ticker: now a single quiet line (see loadStatus) -- lives at the top of
     the filter rail since it's status *about* the data the filters query. */
  .ticker { font-size: 0.72rem; padding-bottom: 0.7rem; border-bottom: 1px solid var(--hairline); }
  .ticker .seg { display: flex; justify-content: space-between; gap: 0.5rem; }
  .ticker .k { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.66rem; }
  .ticker .v { font-weight: 600; }
  .ticker .v.stale { color: var(--alert); }
  .ticker .v.ok { color: var(--verified); }

  .filters label {
    display: flex; flex-direction: column; font-size: 0.68rem; color: var(--text-dim);
    gap: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .filters-heading {
    font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 0.4rem; padding-top: 0.1rem;
    border-top: 1px solid var(--hairline);
  }
  .realm-lock-hint {
    font-size: 0.72rem; color: var(--text-dim); line-height: 1.4; margin-top: -0.5rem;
  }
  .realm-lock-hint a { color: var(--bullion); }
  .filters select:disabled { opacity: 0.65; cursor: not-allowed; }
  /* 2-column grid, not a stacked list -- halves the vertical space these
     checkbox groups take (added 2026-07-26 to fit the whole rail on one
     screen without scrolling). Shared by both item-class and rarity groups. */
  .item-class-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem 0.5rem; }
  .item-class-filters .auto-label { text-transform: none; letter-spacing: 0; }
  .filters input, .filters select {
    background: var(--paper); border: 1px solid var(--hairline-strong); color: var(--ink);
    border-radius: 3px; padding: 0.42rem 0.55rem; width: 100%; font-size: 0.85rem;
    font-family: inherit;
  }
  .filters input:focus-visible, .filters select:focus-visible,
  button:focus-visible, a:focus-visible { outline: 2px solid var(--bullion); outline-offset: 1px; }
  .filters input[type=checkbox] { width: auto; }
  .filters .auto-label { flex-direction: row; align-items: center; gap: 0.4rem; text-transform: none; letter-spacing: 0; }
  /* ---------- Ledger table ---------- */
  .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--hairline); border-radius: 6px; transition: opacity 0.15s ease; }
  .table-wrap.loading { opacity: 0.5; pointer-events: none; }
  /* Explicit "fetching" signal -- the dimmed table alone (above) reads more
     like "disabled" than "loading" at a glance. Was previously covered by
     the manual Refresh button's own "Loading…" label before that button
     was removed as redundant (2026-07-25). */
  .loading-indicator {
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 0.78rem; color: var(--text-dim); padding-bottom: 0.6rem;
  }
  .loading-indicator::before {
    content: ""; width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid var(--hairline-strong); border-top-color: var(--bullion);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* table-layout: fixed (2026-07-31, human report + live repro): with the
     default auto layout, the browser sizes every column from the widest
     content across *all* rows currently in the table, so applying a filter
     (which changes the row set, e.g. realm names of varying length once the
     buy-realm cell got a language tag) visibly shifted every column boundary
     on every re-render -- and, since applyFilters()/renderTable() replace
     the whole tbody on every filter change (see renderTable()'s docstring),
     that full-table auto-width recompute over a large row set is real,
     avoidable render cost, not just a visual annoyance. Fixed layout sizes
     columns from the % widths below alone, independent of content, so a
     filter change no longer triggers a layout recompute over the row set at
     all -- just a repaint of the new rows into already-stable columns. */
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; min-width: 640px; table-layout: fixed; }
  th, td { padding: 0.55rem 0.7rem; text-align: right; border-bottom: 1px solid var(--hairline); }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3) { text-align: left; }
  /* Column widths (sums to 100%) -- order matches the <thead> in the markup:
     Buy realm / Item / Variant / Buy / Sell price / EU median / Discount %.
     Item gets the lion's share since it carries an icon + the longest text;
     the three money columns match each other so their coin icons/figures
     line up down the column. */
  th:nth-child(1), td:nth-child(1) { width: 12%; }
  th:nth-child(2), td:nth-child(2) { width: 26%; }
  th:nth-child(3), td:nth-child(3) { width: 10%; }
  th:nth-child(4), td:nth-child(4) { width: 14%; }
  th:nth-child(5), td:nth-child(5) { width: 14%; }
  th:nth-child(6), td:nth-child(6) { width: 14%; }
  th:nth-child(7), td:nth-child(7) { width: 10%; }
  /* Fixed layout no longer lets a cell grow to fit its content, so anything
     that can run long needs an explicit truncation rule instead of silently
     overflowing into the next column -- the existing hover tooltip (see
     showTooltip()) already surfaces the untruncated realm/item name, so
     truncating here doesn't lose information, just display width. */
  td:nth-child(1), td:nth-child(3) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td:nth-child(4), td:nth-child(5), td:nth-child(6) { white-space: nowrap; overflow: hidden; }
  th {
    cursor: pointer; user-select: none; color: var(--text-dim); font-weight: 700;
    white-space: nowrap; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.68rem;
    border-bottom: 1px solid var(--hairline-strong);
  }
  th.active { color: var(--bullion); }
  th .dir { display: inline-block; width: 0.7em; opacity: 0.8; }
  tbody tr:hover { background: var(--paper); }
  tbody tr.sub-row { background: var(--paper); }
  tbody tr.sub-row td { color: var(--text-dim); }
  .item-cell { display: flex; align-items: center; gap: 0.5rem; cursor: default; min-width: 0; }
  .item-cell a { display: flex; line-height: 0; }
  /* A flex item's default min-width is auto (its content size), which would
     stop this from ever shrinking below the full item name and defeat the
     fixed-width column's truncation above -- min-width: 0 opts back in. */
  .item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  /* Rarity as a colored frame around the icon art (like WoW's own UI),
     not the name's text color -- Blizzard's quality palette (near-white
     for Common, saturated green/cyan for others) was built for dark panels
     and fails contrast as *text* on paper. An inset ring renders against
     the icon's own artwork, not the page background, so it stays visible
     (including white/Common) regardless of page theme -- set inline per
     row via --q (falls back to a neutral hairline when unknown). */
  .item-icon {
    /* Bigger + a thicker ring than the first pass -- 24px/2px read as
       nearly invisible at a glance; 28px/3px gives the color real
       presence without swallowing the icon art underneath. */
    width: 28px; height: 28px; border-radius: 4px; flex-shrink: 0;
    border: 1px solid var(--hairline-strong);
    box-shadow: inset 0 0 0 3px var(--q, transparent);
  }
  .item-cell a .item-icon:hover { border-color: var(--bullion); cursor: pointer; }
  /* Swatch next to each rarity-filter checkbox label -- same --q custom
     property/border convention as .item-icon's ring, so the filter legend
     stays visually tied to what the icon rings actually mean. */
  .rarity-swatch {
    display: inline-block; width: 0.85em; height: 0.85em; border-radius: 3px;
    background: var(--q, transparent); border: 1px solid var(--hairline-strong);
    vertical-align: middle; flex-shrink: 0;
  }
  /* Muted "sus item" icon (see dashboard.py's sus_item_suspect) --
     deliberately not the alarm-red/amber palette, since this is an
     informational item-identity note, not a caution. */
  .sus-flag { color: #7c6a52; margin-left: 0.3rem; cursor: help; }
  /* Realm language tag (see dashboard.py's buy_realm_category) -- a quiet
     2-letter abbreviation, not a badge, since it's informational context
     about the realm, not a signal about the listing itself. */
  .realm-lang { color: var(--text-dim); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em; }
  .group-toggle {
    background: var(--paper); border: 1px solid var(--hairline-strong); color: var(--text-dim);
    border-radius: 999px; padding: 0.05rem 0.5rem; font-size: 0.68rem; cursor: pointer;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin-left: 0.2rem;
  }
  .group-toggle:hover { border-color: var(--bullion); color: var(--bullion); }
  .empty { color: var(--text-dim); padding: 1.5rem 0; text-align: center; font-size: 0.85rem; }
  /* "Show more" (see RENDER_PAGE_SIZE/renderLimit) -- a filter that matches
     thousands of rows used to rebuild the whole tbody (thousands of DOM
     rows) on every keystroke/checkbox click, measured live at ~1s per
     re-render; this caps what's actually built to one page at a time. */
  .show-more-btn {
    display: block; margin: 1rem auto 0; padding: 0.5rem 1.2rem;
    background: var(--paper); border: 1px solid var(--hairline-strong); color: var(--text-dim);
    border-radius: 4px; cursor: pointer; font-size: 0.8rem;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; transition: border-color 0.15s, color 0.15s;
  }
  .show-more-btn:hover { border-color: var(--bullion); color: var(--bullion); }

  /* ---------- Coin display ---------- */
  .money { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .money-part { display: inline-flex; align-items: center; gap: 3px; margin-right: 7px; }
  .coin {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    box-shadow: inset -1px -1px 1px rgba(0,0,0,0.35), inset 1px 1px 1px rgba(255,255,255,0.5);
  }
  .coin-gold   { background: radial-gradient(circle at 35% 30%, #f3d78a, var(--coin-gold) 55%, #a3821f); }
  .coin-silver { background: radial-gradient(circle at 35% 30%, #f4f4f4, var(--coin-silver) 55%, #7c7c7c); }
  .coin-copper { background: radial-gradient(circle at 35% 30%, #dba573, var(--coin-copper) 55%, #7a4a20); }

  /* ---------- Tooltip: a certificate card, not a cargo tag ---------- */
  #tooltip {
    position: fixed; z-index: 1000; display: none; pointer-events: none;
    min-width: 220px; max-width: 320px;
    background: var(--card);
    border: 1px solid var(--bullion); border-radius: 4px;
    box-shadow: 0 8px 24px rgba(20,22,26,0.14);
    padding: 0.65rem 0.8rem; font-size: 0.8rem; color: var(--text-dim);
  }
  #tooltip .tt-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.45rem; }
  #tooltip .tt-icon {
    width: 40px; height: 40px; border-radius: 4px;
    border: 1px solid var(--hairline-strong);
    box-shadow: inset 0 0 0 3px var(--q, transparent);
  }
  #tooltip .tt-name { font-weight: 700; font-size: 0.95rem; line-height: 1.2; color: var(--ink); display: flex; align-items: center; gap: 0.4rem; }
  #tooltip .tt-sub { color: var(--text-dim); font-size: 0.7rem; margin-bottom: 0.4rem; }
  #tooltip .tt-row { display: flex; justify-content: space-between; gap: 1rem; margin: 0.2rem 0; }
  #tooltip .tt-row .lbl { color: var(--text-dim); text-transform: uppercase; font-size: 0.68rem; letter-spacing: 0.04em; }
  #tooltip hr { border: none; border-top: 1px solid var(--hairline); margin: 0.45rem 0; }

  @media (prefers-reduced-motion: no-preference) {
    tbody tr { transition: background-color 0.1s ease; }
  }

  /* Rail sits above the table on narrow viewports instead of squeezing it. */
  @media (max-width: 900px) {
    .shell { flex-direction: column; }
    .filters { flex-basis: auto; width: 100%; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <a href="/" class="brand-link" aria-label="Realm Arbitrage home">
      <svg class="seal" width="26" height="26" viewBox="0 0 30 30" aria-hidden="true">
        <circle cx="15" cy="15" r="13" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="15" cy="15" r="10" fill="none" stroke="currentColor" stroke-width="0.6"/>
        <!-- Coin-edge tick marks -- a struck medallion/assay-stamp detail, not
             just a plain ring, reinforcing the certification-seal identity. -->
        <g stroke="currentColor" stroke-width="0.9" stroke-linecap="round">
          <line x1="15" y1="1" x2="15" y2="3.4"/>
          <line x1="15" y1="26.6" x2="15" y2="29"/>
          <line x1="1" y1="15" x2="3.4" y2="15"/>
          <line x1="26.6" y1="15" x2="29" y2="15"/>
          <line x1="5.11" y1="5.11" x2="6.81" y2="6.81"/>
          <line x1="23.19" y1="23.19" x2="24.89" y2="24.89"/>
          <line x1="5.11" y1="24.89" x2="6.81" y2="23.19"/>
          <line x1="23.19" y1="6.81" x2="24.89" y2="5.11"/>
        </g>
        <path d="M9.5 15.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Realm Arbitrage</h1>
    </a>
  </div>
  <div class="nav">
    <button id="theme-toggle" title="Switch to dark mode" aria-label="Switch to dark mode">&#9789;</button>
    <a href="/snipes" class="active">Dashboard</a>
    <a href="/watchlist">Watchlist</a>
    <a href="/snipe-board">Snipe Board</a>
    <a href="/profile">Profile</a>
    <button id="logout">Log out</button>
  </div>
</div>

<div class="shell">
  <aside class="filters">
    <div class="ticker" id="ticker"></div>
    <label>Sell realm <select id="sell"></select></label>
    <div id="realm-lock-hint" class="realm-lock-hint" style="display:none;"></div>
    <label>Min discount % <input id="min_discount_pct" type="number" min="0" max="100" step="5" value="30"></label>
    <div class="filter-row">
      <label>Min buy (g) <input id="min_gold" type="number" step="1" min="0" placeholder="any"></label>
      <label>Max buy (g) <input id="max_gold" type="number" step="1" min="0" placeholder="any"></label>
    </div>
    <div class="filter-row">
      <label>Min sell price (g) <input id="min_sell_now" type="number" step="1" min="0" placeholder="any"></label>
      <label>Max per item <input id="max_per_item" type="number" min="1" step="1" placeholder="any"></label>
    </div>
    <label class="auto-label">
      <input id="unique_appearance" type="checkbox"> Unique transmog only
    </label>
    <label class="auto-label" title="Old, likely-obsolete gear: neck/ring/trinket items below ilvl 150 from long-superseded expansions (no transmog value, usually no real market), plus the 52 confirmed class-starter armor pieces (e.g. Paladin's Girdle) every new character gets. Can't tell a dead item apart from a genuinely valuable twink item, so this is never filtered server-side -- toggle to judge for yourself.">
      <input id="hide_sus_items" type="checkbox"> Hide flagged (sus items)
    </label>
    <div>
      <div class="filters-heading">Item class</div>
      <div class="item-class-filters">
        <label class="auto-label"><input id="class_weapon" type="checkbox"> Weapons</label>
        <label class="auto-label"><input id="class_armor" type="checkbox"> Armor</label>
        <label class="auto-label"><input id="class_container" type="checkbox"> Containers</label>
        <label class="auto-label"><input id="class_profession" type="checkbox"> Profession</label>
        <label class="auto-label"><input id="class_housing" type="checkbox"> Housing</label>
        <label class="auto-label"><input id="class_battlepet" type="checkbox"> Battle pets</label>
        <label class="auto-label"><input id="class_quest" type="checkbox"> Quest items</label>
        <label class="auto-label"><input id="class_mount" type="checkbox"> Mounts</label>
        <label class="auto-label"><input id="class_recipe" type="checkbox"> Recipes</label>
      </div>
    </div>
    <div>
      <div class="filters-heading">Rarity</div>
      <div class="item-class-filters">
        <label class="auto-label"><input id="quality_poor" type="checkbox"> <span class="rarity-swatch" style="--q:#9d9d9d"></span> Poor</label>
        <label class="auto-label"><input id="quality_common" type="checkbox"> <span class="rarity-swatch" style="--q:#ffffff"></span> Common</label>
        <label class="auto-label"><input id="quality_uncommon" type="checkbox"> <span class="rarity-swatch" style="--q:#1eff00"></span> Uncommon</label>
        <label class="auto-label"><input id="quality_rare" type="checkbox"> <span class="rarity-swatch" style="--q:#0070dd"></span> Rare</label>
        <label class="auto-label"><input id="quality_epic" type="checkbox"> <span class="rarity-swatch" style="--q:#a335ee"></span> Epic</label>
        <label class="auto-label"><input id="quality_legendary" type="checkbox"> <span class="rarity-swatch" style="--q:#ff8000"></span> Legendary</label>
      </div>
    </div>
    <label class="auto-label">
      <input id="auto" type="checkbox" checked> Auto-refresh (60s)
    </label>
  </aside>

  <main class="content">
    <div id="loading-indicator" class="loading-indicator" style="display:none;">Loading latest data&hellip;</div>
    <div class="table-wrap" id="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-sort="buy_realm">Buy realm <span class="dir"></span></th>
          <th data-sort="item">Item <span class="dir"></span></th>
          <th data-sort="variant">Variant <span class="dir"></span></th>
          <th data-sort="buy">Buy <span class="dir"></span></th>
          <th data-sort="gold">Sell price <span class="dir"></span></th>
          <th data-sort="eu_median">EU median <span class="dir"></span></th>
          <th data-sort="discount">Discount % <span class="dir"></span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    </div>
    <button id="show-more" class="show-more-btn" style="display:none;"></button>
    <div id="empty" class="empty" style="display:none;">No snipes at these thresholds.</div>
  </main>
</div>

<div id="tooltip"></div>

<script>
const $ = (id) => document.getElementById(id);
// Table sort is entirely client-side (see renderTable) -- clicking a column
// header never re-fetches, it just re-orders whatever's already loaded. The
// fetch itself always asks the server for the discount-ranked top N (the
// primary "best snipes" ordering); re-sorting by another column reorders
// within that same fetched batch rather than asking the server for a
// differently-ranked top N, which is what makes it instant instead of
// round-tripping on every click.
let sort = "discount";
let sortDir = "desc";
let timer = null;
// The batch fetch is the only network round-trip in the normal filtering
// flow -- see fetchBatch()/renderTable() below. cachedRows is exactly what
// the server last returned (loosest possible thresholds, a big BATCH_TOP);
// every filter in the rail re-slices/re-filters this in the browser, same
// pattern the client-side sort fix already established. Only a sell-realm
// switch or the 60s auto-refresh timer re-fetches.
let cachedRows = [];
// Guards against overlapping fetchBatch() calls -- real production issue,
// 2026-07-25: on a cold item-name cache, a single /api/snipes call could
// take 30-175s (see CLAUDE.md), and checkForUpdates()'s 60s timer doesn't
// wait for a prior invocation to settle before firing again, so a slow
// request kept getting piled on top of by fresh ones instead of being let
// to finish -- the dashboard read as permanently stuck loading even though
// each individual request would eventually complete. A skip-if-busy guard
// is enough here (not a queue/cancel) since checkForUpdates()/fetchBatch()
// always re-fetch the *same* loose batch -- a second concurrent call for
// the same data adds nothing a first one wasn't already going to deliver.
let fetchInFlight = false;
let displayRows = [];    // flattened, on-screen order (main + expanded sub-rows) -- what tooltip lookups index into
let openGroups = new Set();  // group keys the user has expanded to see every listing for that item/variant
let currentRegion = null;
let currentSellSlug = null;
// Which sell realm cachedRows actually belongs to -- lets fetchBatch() tell
// "quiet background refresh of the realm already on screen" apart from
// "stale rows from whatever realm was selected before this one," which
// cachedRows.length alone can't distinguish (see onSellRealmChange()).
let cachedRowsSell = null;

// The ceiling this client ever asks for -- the server (dashboard.py's
// SNIPE_TIER_CAPS) is what actually enforces the real per-account limit
// (250 free / 2000 subscribed / 10000 superuser, superuser raised from 5000
// 2026-07-26), clamping down regardless of what's requested here. Always
// requesting the top of that range means the frontend never needs to know
// its own tier ahead of time -- whatever comes back is already the correct,
// capped amount. Must stay >= the highest tier cap, or that tier's own
// requests get clamped by this instead of by the server.
const BATCH_TOP = 10000;

// localStorage cache of the last-fetched batch, keyed per (sell realm, item
// restriction) so a page refresh (or revisit) can paint instantly instead of
// showing a blank table while the network round trip is in flight, and so
// the 60s auto-refresh timer can skip the expensive /api/snipes DuckDB query
// entirely when Blizzard hasn't actually published anything new -- see
// checkForUpdates() below. CACHE_VERSION bumps if the cached row shape ever
// changes, so an old cache from a previous version of this page can't get
// rendered against code that expects different fields. Bumped to 2
// (2026-07-27): sell_price_suspect/region_median_g/region_median_copper
// were added to the row shape -- a cache from before that shipped would
// otherwise repaint with those fields missing (NaN in the EU median
// column, a suspect flag that never shows/hides) until it happened to
// expire or the sell realm/item filter changed.
// Bumped to 3 (2026-07-31): legacy_jewelry_suspect was added to the row
// shape -- a cache from before this shipped would repaint with a flag that
// never shows/hides until it happened to expire or the sell realm/item
// filter changed, same reasoning as the 1->2 bump above.
// Bumped to 4 (2026-07-31, same day): sell_price_suspect was removed and
// legacy_jewelry_suspect was renamed/broadened to legacy_gear_suspect -- a
// cache from before this shipped would carry a stale sell_price_suspect
// field (harmless, just dead weight) and be missing legacy_gear_suspect
// under its new name (the flag/checkbox would silently never show/hide
// until the cache happened to expire), same reasoning as every prior bump.
// Bumped to 5 (2026-07-31, same day again): legacy_gear_suspect renamed to
// sus_item_suspect (human preference -- "sus items," not "legacy gear").
// Bumped to 6 (2026-07-31, same day again): buy_realm_category was added to
// the row shape -- a cache from before this shipped would repaint with no
// language tag next to the buy realm until it happened to expire or the
// sell realm/item filter changed, same reasoning as every prior bump.
const CACHE_VERSION = 6;
// Safety net, not the primary freshness signal: even if last_modified still
// matches, force a real refetch once a cache is this old, in case the
// status endpoint itself is stuck/wrong for some other reason. Comfortably
// above Blizzard's ~hourly publish cadence so it practically never fires in
// the normal case.
const MAX_CACHE_AGE_MS = 2 * 60 * 60 * 1000;

// The realm dropdown otherwise has no memory of its own -- init() always
// falls back to /api/config's site-wide default_sell (e.g. Draenor) on
// every fresh page load, so navigating away (e.g. to Snipe Board) and back
// silently reset a subscribed/superuser account's realm choice back to the
// site default (a real report, 2026-07-30). A free-tier lock is a genuine
// server-enforced constraint and always takes priority over this -- see
// where LAST_SELL_KEY is read in init() below.
const LAST_SELL_KEY = "last_sell_realm";

function cacheKey(sell) {
  return `snipe_cache_v${CACHE_VERSION}_${sell}`;
}
function loadCache(sell) {
  try {
    const raw = localStorage.getItem(cacheKey(sell));
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveCache(sell, payload) {
  // A CACHE_VERSION bump orphans every old-version entry -- loadCache() only
  // ever reads under the *current* version, so a stale one can never be
  // used again, but it doesn't disappear from localStorage on its own.
  // Purge every other-version key before writing, not just on logout
  // (clearAllCaches()), or it just sits there consuming quota forever.
  try {
    Object.keys(localStorage)
      .filter(k => k.startsWith("snipe_cache_v") && !k.startsWith(`snipe_cache_v${CACHE_VERSION}_`))
      .forEach(k => localStorage.removeItem(k));
  } catch (e) { /* nothing to clean up if localStorage itself is unavailable */ }
  // A full BATCH_TOP=10000-row batch, at up to ~1KB/row once names=true's
  // icon URLs/labels are included, can exceed the browser's per-origin
  // localStorage quota outright -- confirmed live 2026-07-27 on Draenor
  // (11.12MB for 10,000 rows, several MB over quota even with the orphaned-
  // key purge above already applied). Silently failing to cache at all
  // meant every load painted from nothing and read as a cold "Loading
  // latest data..." forever, since the write that would have fixed that
  // never succeeded either.
  //
  // Shrinking THIS realm's own row count only helps if THIS realm's data is
  // what's filling the quota. Confirmed live 2026-07-30: a browser with 3
  // other realms already cached (~5MB combined -- Twisting Nether, Draenor,
  // Archimonde) could not write a Scarshield Legion cache at ALL, at any row
  // count, because those other realms' full-size entries were what used up
  // the quota, not Scarshield Legion's own payload -- shrinking a payload
  // that isn't the problem never helps. Evict the least-recently-fetched
  // *other* realm's cache first (LRU, not a blanket wipe) and retry at the
  // same size before ever shrinking this realm's own data.
  let rows = payload.rows;
  for (let attempt = 0; attempt < 50; attempt++) {
    try {
      localStorage.setItem(cacheKey(sell), JSON.stringify({...payload, rows}));
      return;
    } catch (e) {
      if (evictOldestOtherCache(sell)) continue;  // freed space -- retry at the same size
      if (rows.length === 0) return;  // nothing left to evict or shrink
      rows = rows.slice(0, Math.ceil(rows.length / 2));
    }
  }
}

// Removes the least-recently-fetched *other* realm's cache entry (by
// fetchedAt) to free quota for the one saveCache() is currently trying to
// write. Returns false once there's nothing else left to evict, at which
// point saveCache() falls back to shrinking its own payload instead.
function evictOldestOtherCache(excludeSell) {
  const excludeKey = cacheKey(excludeSell);
  let oldestKey = null, oldestTime = Infinity;
  for (const k of Object.keys(localStorage)) {
    if (!k.startsWith(`snipe_cache_v${CACHE_VERSION}_`) || k === excludeKey) continue;
    let fetchedAt = -Infinity;  // a corrupt/unparseable entry is evicted first
    try { fetchedAt = JSON.parse(localStorage.getItem(k)).fetchedAt || -Infinity; } catch (e) {}
    if (fetchedAt < oldestTime) { oldestTime = fetchedAt; oldestKey = k; }
  }
  if (!oldestKey) return false;
  localStorage.removeItem(oldestKey);
  return true;
}
function clearAllCaches() {
  try {
    Object.keys(localStorage)
      .filter(k => k.startsWith("snipe_cache_v"))
      .forEach(k => localStorage.removeItem(k));
    // Same reasoning as the snipe-cache purge above: localStorage is
    // origin-scoped, not per-account, so a different user logging in on
    // this browser shouldn't have their realm dropdown silently pre-filled
    // with whatever the previous account last picked.
    localStorage.removeItem(LAST_SELL_KEY);
  } catch (e) { /* nothing to clean up if localStorage itself is unavailable */ }
}

// Blizzard's official item_class ids (confirmed live via
// GET /data/wow/item-class/index, 2026-07-24 -- see item_names.py). Mounts
// need the subclass too since they're a subclass of Miscellaneous(15), not
// their own class. Every predicate here is a pure client-side filter over
// already-fetched rows -- no network call.
const ITEM_CLASS_FILTERS = [
  { key: "weapon",     label: "Weapons",      test: r => r.item_class === 2 },
  { key: "armor",      label: "Armor",        test: r => r.item_class === 4 },
  { key: "container",  label: "Containers",   test: r => r.item_class === 1 },
  { key: "profession", label: "Profession",   test: r => r.item_class === 19 },
  { key: "housing",    label: "Housing",      test: r => r.item_class === 20 },
  { key: "battlepet",  label: "Battle pets",  test: r => r.item_class === 17 },
  { key: "quest",      label: "Quest items",  test: r => r.item_class === 12 },
  { key: "mount",      label: "Mounts",       test: r => r.item_class === 15 && r.item_subclass === 5 },
  { key: "recipe",     label: "Recipes",      test: r => r.item_class === 9 },
];

// Blizzard's quality tier names (item_names.py's quality(), same tier
// quality_color() derives the icon ring from). Same OR-within-the-group,
// AND-with-everything-else pattern as ITEM_CLASS_FILTERS -- no rarity
// checked means no filtering, multiple checked means match any of them.
const QUALITY_FILTERS = [
  { key: "poor",      label: "Poor",      test: r => r.quality === "POOR" },
  { key: "common",    label: "Common",    test: r => r.quality === "COMMON" },
  { key: "uncommon",  label: "Uncommon",  test: r => r.quality === "UNCOMMON" },
  { key: "rare",      label: "Rare",      test: r => r.quality === "RARE" },
  { key: "epic",      label: "Epic",      test: r => r.quality === "EPIC" },
  { key: "legendary", label: "Legendary", test: r => r.quality === "LEGENDARY" },
];

const NUMERIC_SORT_KEYS = new Set(["buy", "gold", "eu_median", "discount"]);
const SORT_VALUE = {
  buy_realm: r => (r.buy_realm_name || "").toLowerCase(),
  item: r => (r.name || String(r.item_id)).toLowerCase(),
  variant: r => (r.variant || "").toLowerCase(),
  buy: r => r.buy_copper,
  gold: r => r.sell_copper,
  eu_median: r => r.region_median_copper,
  discount: r => r.discount_pct,
};

// Ties on the primary sort column always resolve to cheapest buy price
// first, regardless of sortDir (added 2026-07-28, human decision, mirrors
// snipe_check.SORT_COLUMNS' secondary "buy_g ASC" -- discount_pct is
// rounded to 1 decimal server-side, so a single camped/troll sell-realm
// listing can make dozens of genuinely-different buy prices all round to
// the exact same displayed discount%, leaving their relative order
// undefined without this). Deliberately NOT flipped by sortDir -- it's a
// tiebreak, not a sortable column of its own.
function tiebreak(a, b) {
  return a.buy_copper - b.buy_copper;
}

function compareRows(a, b) {
  const val = SORT_VALUE[sort];
  const va = val(a), vb = val(b);
  // Nulls always sort last, regardless of asc/desc -- "unknown" isn't a
  // high or low value, it's just missing.
  if (va == null && vb == null) return tiebreak(a, b);
  if (va == null) return 1;
  if (vb == null) return -1;
  const cmp = (typeof va === "number" && typeof vb === "number")
    ? va - vb
    : String(va).localeCompare(String(vb));
  if (cmp !== 0) return sortDir === "asc" ? cmp : -cmp;
  return tiebreak(a, b);
}

// Multiple listings can snipe the same item/variant (different buy realms,
// or several auctions on one) -- group them so the ledger shows one line per
// item, with the single best deal on top, instead of drowning duplicates.
// Groups on (item_id, pet_species_id, pet_quality_id), not variant_raw
// (changed 2026-07-26, replacing the old market_key-based grouping --
// matching itself stopped looking at bonus_key/ilvl at all, see
// snipe_check.find_snipes()'s docstring, so grouping follows the same key).
// Pet identity is still needed here even though bonus_key no longer
// matters: every caged pet shares one item_id (82800), so item_id alone
// would wrongly merge every pet species/quality into one group; it's null
// for ordinary gear, a no-op there.
function groupKey(row) {
  return `${row.item_id}|${row.pet_species_id ?? ""}|${row.pet_quality_id ?? ""}`;
}

function buildGroups(rows) {
  const map = new Map();
  const order = [];
  for (const row of rows) {
    const key = groupKey(row);
    if (!map.has(key)) { map.set(key, []); order.push(key); }
    map.get(key).push(row);
  }
  // "Max per item" (client-side now, see applyFilters callers) trims each
  // group down to its best N listings rather than hiding the item entirely
  // when it has more than N -- the item's best-discount listing should
  // never disappear just because it has many duplicates; only the "expand
  // to see the rest" list shrinks.
  const maxPerItemRaw = $("max_per_item").value.trim();
  const maxPerItemParsed = maxPerItemRaw ? Number(maxPerItemRaw) : NaN;
  // Clamp anything that isn't a real positive cap to "no cap" (2026-07-31,
  // real bug fix): the input's min="1"/step="1" are just spinner hints, not
  // enforced against direct typing. Number("0") is falsy, so `if (maxPerItem)`
  // below used to silently treat "0" the same as a blank field (no cap) --
  // confusing, since a user typing 0 clearly meant *something*, not "any".
  // Number("-5") is truthy and Array.slice(0, -5) means "drop the last 5",
  // the opposite of a per-item cap -- a negative input silently inverted the
  // filter instead of erroring or being ignored.
  const maxPerItem = Number.isInteger(maxPerItemParsed) && maxPerItemParsed >= 1 ? maxPerItemParsed : null;
  // Within a group, "biggest snipe" always means highest discount% -- that's
  // fixed regardless of which column the overall table is currently sorted
  // by, since it's what makes one listing the group's best representative.
  // Ties (see tiebreak()'s comment -- discount_pct is rounded to 1 decimal,
  // so a camped/troll sell price can tie dozens of rows at once) fall back
  // to cheapest buy price first, same as the top-level table sort.
  return order.map(key => {
    let groupRows = map.get(key).slice()
      .sort((a, b) => (b.discount_pct - a.discount_pct) || tiebreak(a, b));
    if (maxPerItem) groupRows = groupRows.slice(0, maxPerItem);
    return { key, rows: groupRows };
  });
}

// All the filter-rail thresholds that used to be server-side query params --
// now applied entirely in the browser against the cached batch (cachedRows),
// so changing any of these never triggers a network request.
function applyFilters(rows) {
  const minDiscount = Number($("min_discount_pct").value) || 0;
  const minGoldRaw = $("min_gold").value.trim();
  const maxGoldRaw = $("max_gold").value.trim();
  const minSellNowRaw = $("min_sell_now").value.trim();
  const minGold = minGoldRaw ? Number(minGoldRaw) * 10000 : null;
  const maxGold = maxGoldRaw ? Number(maxGoldRaw) * 10000 : null;
  const minSellNow = minSellNowRaw ? Number(minSellNowRaw) * 10000 : null;
  const uniqueOnly = $("unique_appearance").checked;
  const hideSusItems = $("hide_sus_items").checked;
  const activeClasses = ITEM_CLASS_FILTERS.filter(c => $(`class_${c.key}`).checked);
  const activeQualities = QUALITY_FILTERS.filter(q => $(`quality_${q.key}`).checked);

  return rows.filter(r => {
    if (r.discount_pct < minDiscount) return false;
    if (minGold != null && r.buy_copper < minGold) return false;
    if (maxGold != null && r.buy_copper > maxGold) return false;
    // A row with no current sell-realm listing never appears at all
    // (sell_copper IS the sell realm's current cheapest listing, see
    // snipe_check.find_snipes' 2026-07-25 pricing-model docstring -- there's
    // no separate percentile fallback left), so this is just a floor.
    if (minSellNow != null && r.sell_copper < minSellNow) return false;
    // "Unique" means no other item grants the same transmog look, excluding
    // profession tool/accessory slots (is_profession_item, see dashboard.py)
    // which aren't part of the visible paperdoll model at all -- mirrors
    // snipe_check.find_snipes' server-side --max-appearance-sources exactly.
    if (uniqueOnly && !(r.appearance_sources === 1 && !r.is_profession_item)) return false;
    // sus_item_suspect (see snipe_check.is_sus_item()) is non-authoritative
    // -- known blind spot for twink-valuable items, see that function's
    // comment -- so this checkbox is the only thing that can hide it, and
    // only when the user asks for it.
    if (hideSusItems && r.sus_item_suspect) return false;
    // No class checked = no class filtering (show everything); any checked
    // = row must match at least one.
    if (activeClasses.length && !activeClasses.some(c => c.test(r))) return false;
    if (activeQualities.length && !activeQualities.some(q => q.test(r))) return false;
    return true;
  });
}

// Only the param that actually changes *which* rows are candidates at the
// SQL/join level -- sell realm. Every threshold that used to narrow the SQL
// query (min_discount, min_gold/max_gold, min_sell_now, max_appearance_sources,
// max_per_item) is deliberately NOT sent here anymore; the batch is fetched
// as loose as possible (see BATCH_TOP) and applyFilters() reproduces all of
// them client-side instead. The item-id restriction (items=csv) was removed
// 2026-07-27 (human request) -- see cacheKey()/renderFromCache() etc, which
// dropped the corresponding parameter.
function batchParams() {
  const p = new URLSearchParams();
  p.set("sell", $("sell").value);
  p.set("min_discount", "0");
  p.set("top", String(BATCH_TOP));
  p.set("sort", "discount");
  p.set("names", "true");  // always on -- names/icons aren't worth making optional
  return p;
}

function fmtHttpDate(s) {
  if (!s) return "never";
  const d = new Date(s);
  return isNaN(d) ? s : d.toLocaleString();
}

// Escapes row data before it's interpolated into innerHTML template strings
// below, including inside double-quoted attributes (e.g. title="...") --
// the naive div.textContent->innerHTML trick only escapes what a browser
// escapes when serializing *text content* (&/</>), not quotes, and this
// project already shipped that exact gap once (static/snipeboard.html's
// post titles, a real stored-XSS fix 2026-07-31). item/realm names here
// come from Blizzard's API, which is generally curated but not contractually
// guaranteed free of quotes/angle brackets -- escape defensively rather than
// trust it.
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

// WoW-style gold/silver/copper coin display, formatted only here at the
// display boundary -- the API sends raw copper end to end.
function formatMoney(copper) {
  copper = Math.round(copper);
  const gold = Math.floor(copper / 10000);
  const silver = Math.floor((copper % 10000) / 100);
  const bronze = copper % 100;
  const parts = [];
  if (gold > 0) parts.push(`<span class="money-part">${gold}<span class="coin coin-gold"></span></span>`);
  if (gold > 0 || silver > 0) parts.push(`<span class="money-part">${silver}<span class="coin coin-silver"></span></span>`);
  parts.push(`<span class="money-part">${bronze}<span class="coin coin-copper"></span></span>`);
  return `<span class="money">${parts.join("")}</span>`;
}

// Language community label (2026-07-31, human request) -- EU realms aren't
// otherwise labeled by language, so this abbreviates Blizzard's own
// "category" field (English/German/French/Italian/Russian/Spanish, confirmed
// live) to a 2-letter tag next to a realm's name wherever it's shown.
const REALM_LANG_ABBR = {
  English: "EN", German: "DE", French: "FR", Italian: "IT", Russian: "RU", Spanish: "ES",
};
function realmLangTag(category) {
  if (!category) return "";
  return REALM_LANG_ABBR[category] || category;
}

function undermineUrl(row) {
  if (!currentRegion || !currentSellSlug) return null;
  return `https://undermine.exchange/#${currentRegion}-${currentSellSlug}/${row.item_id}`;
}

// Rarity renders as a colored inset ring around the icon art (see the
// .item-icon/.tt-icon CSS) via the --q custom property, not the name's text
// color -- Blizzard's quality palette was built for dark panels and most of
// it fails contrast as *text* on this page's paper background.
function iconStyle(color) {
  return color ? ` style="--q:${color}"` : "";
}

function showTooltip(row, x, y) {
  const tt = $("tooltip");
  const icon = row.icon
    ? `<img class="tt-icon"${iconStyle(row.quality_color)} src="${row.icon}" alt="" onerror="this.style.display='none'">`
    : "";
  const ue = undermineUrl(row);
  tt.innerHTML = `
    <div class="tt-head">
      ${icon}
      <div>
        <div class="tt-name">${escapeHtml(row.name ?? ("item " + row.item_id))}</div>
        <div class="tt-sub">Item ${row.item_id}${row.variant_raw ? " &middot; " + escapeHtml(row.variant) : ""}</div>
      </div>
    </div>
    <div class="tt-row"><span class="lbl">Buy realm</span><span>${escapeHtml(row.buy_realm_name)}${row.buy_realm_category ? ` (${escapeHtml(row.buy_realm_category)})` : ""}</span></div>
    <div class="tt-row"><span class="lbl">Buy price</span>${formatMoney(row.buy_copper)}</div>
    <div class="tt-row"><span class="lbl">Sell price</span>${formatMoney(row.sell_copper)}</div>
    <div class="tt-row"><span class="lbl">EU median</span>${formatMoney(row.region_median_copper)}</div>
    <div class="tt-row"><span class="lbl">Discount</span><span>${row.discount_pct.toFixed(1)}%</span></div>
    ${row.appearance_sources != null
      ? `<div class="tt-row"><span class="lbl">Appearance</span><span>${row.appearance_sources === 1 ? "unique look" : `shared by ${row.appearance_sources} items`}</span></div>`
      : ""}
    ${row.sus_item_suspect
      ? `<div class="tt-row"><span class="lbl">Note</span><span>Sus item, possibly obsolete (experimental)</span></div>`
      : ""}
    ${ue ? `<hr><div class="tt-sub">Click the icon for Undermine Exchange &rarr;</div>` : ""}
  `;
  tt.style.display = "block";
  positionTooltip(x, y);
}

function positionTooltip(x, y) {
  const tt = $("tooltip");
  const pad = 14;
  let left = x + pad, top = y + pad;
  const rect = tt.getBoundingClientRect();
  if (left + rect.width > window.innerWidth) left = x - rect.width - pad;
  if (top + rect.height > window.innerHeight) top = y - rect.height - pad;
  tt.style.left = `${Math.max(0, left)}px`;
  tt.style.top = `${Math.max(0, top)}px`;
}

function hideTooltip() {
  $("tooltip").style.display = "none";
}

// One number, one meaning: when Blizzard's AH data (s.last_modified, the
// real Last-Modified header from the sell-realm collector) was last
// actually new -- not "Polled" (removed earlier, was just the browser's
// render-time wall clock) and not split across three overlapping signals
// (Snapshot/Listings swept/Ledger build status) that all gestured at "is the
// data fresh" without a single clear answer.
function renderStatusTicker(s) {
  const stale = !s.has_data;
  $("ticker").innerHTML = `
    <div class="seg"><span class="k">Last auction data</span><span class="v mono ${stale ? "stale" : "ok"}">${fmtHttpDate(s.last_modified)}</span></div>
  `;
}

// Cheap by comparison to fetchBatch() -- no DuckDB join, just a file mtime
// lookup -- so checkForUpdates() below can call this every 60s to decide
// *whether* the expensive query is even worth running. Returns the parsed
// status (so callers can read last_modified) or null on failure.
async function loadStatus(sell) {
  if (!sell) return null;
  try {
    const r = await fetch(`/api/status?sell=${encodeURIComponent(sell)}`);
    if (!r.ok) return null;
    const s = await r.json();
    renderStatusTicker(s);
    return s;
  } catch (e) { return null; /* leave last-known status visible */ }
}

function buildRowHtml(row, idx, group, isSub) {
  const ue = undermineUrl(row);
  let icon = "";
  if (row.icon) {
    const img = `<img class="item-icon"${iconStyle(row.quality_color)} src="${row.icon}" alt="" onerror="this.style.display='none'">`;
    icon = ue
      ? `<a href="${ue}" target="_blank" rel="noopener" title="View ${escapeHtml(row.name ?? row.item_id)} on Undermine Exchange">${img}</a>`
      : img;
  }
  const toggle = (group && group.rows.length > 1)
    ? `<button class="group-toggle" data-group="${group.key}" title="${group.rows.length} listings for this item -- click to see them all, best first">${openGroups.has(group.key) ? "&#9652;" : "&#9662;"} ${group.rows.length}</button>`
    : "";
  // sus_item_suspect: an old neck/ring/trinket item (ilvl-wise) or one of
  // the confirmed class-starter armor pieces -- see snipe_check.is_sus_item()'s
  // comment for the live-verified examples and its known twink-market blind
  // spot. This is about the item's *identity*, not its price, so it lives in
  // the item-cell next to the name.
  const susFlag = row.sus_item_suspect
    ? `<span class="sus-flag" title="Sus item -- an ancient neck/ring/trinket item or a class-starter armor piece. Experimental, non-authoritative: can't rule out a genuinely valuable twink item.">&#8987;</span>`
    : "";
  return `
    <tr class="${isSub ? "sub-row" : ""}">
      <td title="realm ${row.buy_realm}${row.buy_realm_category ? " &middot; " + escapeHtml(row.buy_realm_category) : ""}">${escapeHtml(row.buy_realm_name)}${row.buy_realm_category ? ` <span class="realm-lang">${escapeHtml(realmLangTag(row.buy_realm_category))}</span>` : ""}</td>
      <td><div class="item-cell" data-row="${idx}">${icon}<span class="item-name">${escapeHtml(row.name ?? row.item_id)}</span>${susFlag}${toggle}</div></td>
      <td class="mono" title="${escapeHtml(row.variant_raw ?? "")}">${escapeHtml(row.variant)}</td>
      <td class="num">${formatMoney(row.buy_copper)}</td>
      <td class="num">${formatMoney(row.sell_copper)}</td>
      <td class="num">${formatMoney(row.region_median_copper)}</td>
      <td class="num">${row.discount_pct.toFixed(1)}</td>
    </tr>`;
}

// How many top-level groups renderTable() actually builds DOM for on one
// pass. Rebuilding the whole tbody (see below) for every group that matches
// a threshold was measured live at ~1s for ~1,650 groups -- almost entirely
// the innerHTML DOM-construction cost itself, not filtering/sorting (those
// stayed under 15ms combined) -- so capping what gets built, not how the
// build happens, is what actually fixes it. Groups are already sorted
// best-first, so a page boundary here never hides a better match behind a
// worse one -- it just defers building the DOM for rows past what's shown.
const RENDER_PAGE_SIZE = 200;
let renderLimit = RENDER_PAGE_SIZE;

// Pure re-render of whatever's already in cachedRows -- no network call, so
// every filter change, a column-header click, or expanding a group is
// instant (the original "lag" fix was sort re-fetching on every click;
// applyFilters() extends the same idea to every threshold in the rail).
// resetLimit=false (only the group-toggle handler and "Show more" itself
// pass this) keeps the current page size instead of snapping back to the
// first page -- expanding a group you're already looking at, or asking for
// more rows, shouldn't throw away how far you'd scrolled.
function renderTable(resetLimit = true) {
  if (resetLimit) renderLimit = RENDER_PAGE_SIZE;
  const filtered = applyFilters(cachedRows);
  const groups = buildGroups(filtered);
  groups.sort((a, b) => compareRows(a.rows[0], b.rows[0]));
  const pageGroups = groups.slice(0, renderLimit);

  displayRows = [];
  const html = [];
  pageGroups.forEach(group => {
    const best = group.rows[0];
    displayRows.push(best);
    html.push(buildRowHtml(best, displayRows.length - 1, group, false));
    if (openGroups.has(group.key)) {
      group.rows.slice(1).forEach(row => {
        displayRows.push(row);
        html.push(buildRowHtml(row, displayRows.length - 1, null, true));
      });
    }
  });

  $("rows").innerHTML = html.join("");
  $("empty").style.display = groups.length ? "none" : "block";
  $("empty").textContent = "No snipes at these thresholds.";

  const remaining = groups.length - pageGroups.length;
  const moreBtn = $("show-more");
  if (remaining > 0) {
    moreBtn.style.display = "block";
    moreBtn.textContent = `Show ${Math.min(RENDER_PAGE_SIZE, remaining)} more (${remaining} of ${groups.length} not shown)`;
  } else {
    moreBtn.style.display = "none";
  }

  document.querySelectorAll("th[data-sort]").forEach(th => {
    const active = th.dataset.sort === sort;
    th.classList.toggle("active", active);
    const dirEl = th.querySelector(".dir");
    if (dirEl) dirEl.textContent = active ? (sortDir === "asc" ? "▲" : "▼") : "";
  });
}

$("show-more").addEventListener("click", () => {
  renderLimit += RENDER_PAGE_SIZE;
  renderTable(false);
});

function setLoading(isLoading) {
  $("table-wrap").classList.toggle("loading", isLoading);
  $("loading-indicator").style.display = isLoading ? "flex" : "none";
}

// Paints the last-known batch for sell from localStorage, if any -- used
// both on page load and right before fetchBatch()'s own network call, so a
// realm switch or a page refresh never shows a blank table while the real
// request is in flight. Returns true if it painted something.
function renderFromCache(sell) {
  const cached = loadCache(sell);
  if (!cached) return false;
  currentRegion = cached.region;
  currentSellSlug = cached.sellRealmSlug;
  cachedRows = cached.rows;
  cachedRowsSell = sell;
  openGroups.clear();
  renderTable();
  return true;
}

// The only real "give me fresh data" network round-trip -- fetches one
// loose, generously-sized batch (see batchParams()/BATCH_TOP) for the
// current sell realm, then caches it to localStorage. Only ever called by
// checkForUpdates() below (a realm switch, the 60s timer, or initial page
// load all go through that first -- see its own comment) once it's decided
// a real fetch is actually needed -- never by a filter-rail threshold
// changing (those call renderTable() directly instead, see the listeners
// wired at the bottom).
// knownLastModified/knownListingsUpdated: checkForUpdates() already has a
// fresh /api/status result by the time it decides a real fetch is needed --
// pass both through instead of re-fetching /api/status a second time just to
// learn the same values for saveCache(). That second call used to be the
// only thing standing between a successful, on-screen /api/snipes result and
// it ever getting cached: a real report, 2026-07-30 -- Scarshield Legion's
// data loaded and displayed correctly twice in a row, yet had no localStorage
// entry at all, meaning the post-fetch loadStatus() call silently failed
// (or the row was never reached) both times and saveCache() was never
// called, so every future visit redid the full expensive query forever.
async function fetchBatch(knownLastModified, knownListingsUpdated) {
  const sell = $("sell").value;
  if (!sell) return;
  if (fetchInFlight) return;  // an equivalent fetch is already running -- let it finish rather than piling another slow query on top (see fetchInFlight's declaration above)
  renderFromCache(sell);  // instant paint from last-known-good while the real fetch is in flight
  // A background refresh (rows already on screen -- the 60s auto-refresh
  // timer found checkForUpdates()'s status check genuinely advanced, e.g.
  // Blizzard's ~hourly publish landed) shouldn't dim/block the table the
  // same way a cold load with nothing to show yet does -- human feedback,
  // 2026-07-27: this happening roughly once an hour, often with no visibly
  // different result, read as an unwarranted interruption rather than a
  // helpful "loading" signal. Only a load starting from a blank table gets
  // the blocking treatment.
  const isBackgroundRefresh = cachedRows.length > 0 && cachedRowsSell === sell;
  fetchInFlight = true;
  if (!isBackgroundRefresh) setLoading(true);
  try {
    const r = await fetch(`/api/snipes?${batchParams().toString()}`);
    // 402 is no longer possible here -- /api/snipes only requires login now
    // (the free tier, see dashboard.py's SNIPE_TIER_CAPS), not a subscription.
    if (r.status === 401) { window.location.href = "/login"; return; }
    // Stale-response guard (2026-07-31, real bug fix): the realm this fetch
    // was FOR can differ from the realm now selected if the user switched
    // realms while this (slow -- a cold query can take 30-175s) request was
    // still in flight. fetchInFlight prevents two fetches from running at
    // once, so the *newer* realm's own fetchBatch() call silently no-opped
    // above instead of ever running -- without this check, this stale
    // response would be the only thing that ever painted, overwriting the
    // UI with the *previous* realm's data under the *newly*-selected
    // realm's dropdown value, with no error and no visible sign anything
    // was wrong. Discard it and kick off a check for whatever's actually
    // selected now instead of waiting up to 60s for the auto-refresh timer.
    if ($("sell").value !== sell) {
      checkForUpdates();
      return;
    }
    if (!r.ok) {
      // A background refresh failing (transient network blip, server
      // hiccup) shouldn't blank out data that was already good on screen --
      // just leave it and let the next 60s tick try again. Only a cold load
      // with nothing cached shows the error state.
      if (isBackgroundRefresh) return;
      const err = await r.json().catch(() => ({detail: r.statusText}));
      cachedRows = [];
      openGroups.clear();
      renderTable();
      $("empty").textContent = err.detail || "error loading snipes";
      hideTooltip();
      return;
    }
    const data = await r.json();
    // data.caveat (the warband/BoP note) is intentionally not displayed --
    // removed from the UI per product decision; still in the API response.
    currentRegion = data.region;
    currentSellSlug = data.sell_realm_slug;
    cachedRows = data.rows;
    cachedRowsSell = sell;
    openGroups.clear();  // fresh fetch -- collapse groups back to best-first summaries
    renderTable();
    // Use whatever the caller already knew rather than re-fetching /api/status
    // a second time -- only falls back to a fresh call on the cold-start path
    // where checkForUpdates()'s own status check failed and knownLastModified
    // was never available to begin with (see this function's own comment).
    const fallbackStatus = (knownLastModified == null) ? await loadStatus(sell) : null;
    const lastModified = knownLastModified ?? fallbackStatus?.last_modified;
    const listingsUpdated = knownListingsUpdated ?? fallbackStatus?.listings_updated;
    if (lastModified) {
      saveCache(sell, {
        rows: data.rows, region: data.region, sellRealmSlug: data.sell_realm_slug,
        lastModified, listingsUpdated, fetchedAt: Date.now(),
      });
    }
  } finally {
    setLoading(false);
    fetchInFlight = false;
  }
}

// The auto-refresh timer and the initial page load both go through this
// instead of fetchBatch() directly: it's a cheap /api/status check (a file
// mtime, no DuckDB join) first, and only calls the expensive fetchBatch()
// when the data behind the current batch has actually changed since our
// cache -- Blizzard republishes a sell realm's own AH roughly hourly, so
// polling the heavy query every 60s regardless (the original behavior) was
// ~60 checks for every 1 real update. MAX_CACHE_AGE_MS is a safety net in
// case the status signal itself ever gets stuck.
//
// Checks status.listings_updated (the region scanner's sweep timestamp, a
// separate signal from last_modified) in addition to last_modified -- fixed
// 2026-07-31, human report + live repro: a bought-out listing kept showing
// as a snipe for up to an hour after the purchase. Root cause: the buy side
// (data/listings/*.parquet) is what determines whether a listing still
// exists, and scan_region.py's sweep refreshes it every ~10 minutes --
// far more often than last_modified changes (Blizzard only republishes the
// *sell* realm's own AH roughly hourly, at no fixed clock time). Comparing
// only last_modified meant a sweep that removed a bought listing had no way
// to trigger a refetch until last_modified happened to change too, for an
// unrelated reason. Confirmed live: a fresh /api/snipes call already showed
// the listing gone while the cached batch (matching last_modified) still had
// it.
async function checkForUpdates() {
  const sell = $("sell").value;
  if (!sell) return;
  const status = await loadStatus(sell);
  if (!status) { await fetchBatch(); return; }  // status check itself failed -- fall back to a real fetch rather than silently doing nothing
  const cached = loadCache(sell);
  if (cached && cached.lastModified === status.last_modified
      && cached.listingsUpdated === status.listings_updated
      && (Date.now() - cached.fetchedAt) < MAX_CACHE_AGE_MS) {
    return;  // nothing new since our cache -- skip the DuckDB query entirely
  }
  await fetchBatch(status.last_modified, status.listings_updated);
}

document.getElementById("rows").addEventListener("mouseover", (e) => {
  const cell = e.target.closest(".item-cell");
  if (!cell) return;
  const row = displayRows[Number(cell.dataset.row)];
  if (row) showTooltip(row, e.clientX, e.clientY);
});
document.getElementById("rows").addEventListener("mousemove", (e) => {
  const cell = e.target.closest(".item-cell");
  if (cell && $("tooltip").style.display === "block") positionTooltip(e.clientX, e.clientY);
});
document.getElementById("rows").addEventListener("mouseout", (e) => {
  if (e.target.closest(".item-cell") && !e.relatedTarget?.closest(".item-cell")) hideTooltip();
});
document.getElementById("rows").addEventListener("click", (e) => {
  const btn = e.target.closest(".group-toggle");
  if (!btn) return;
  const key = btn.dataset.group;
  if (openGroups.has(key)) openGroups.delete(key); else openGroups.add(key);
  hideTooltip();
  renderTable(false);  // expanding/collapsing a group already on screen shouldn't reset the page
});

document.querySelectorAll("th[data-sort]").forEach(th => {
  th.addEventListener("click", () => {
    const col = th.dataset.sort;
    if (sort === col) {
      sortDir = sortDir === "asc" ? "desc" : "asc";
    } else {
      sort = col;
      sortDir = NUMERIC_SORT_KEYS.has(col) ? "desc" : "asc";
    }
    renderTable();
  });
});

function scheduleAuto() {
  if (timer) clearInterval(timer);
  // checkForUpdates(), not fetchBatch() directly -- most 60s ticks find
  // nothing new (Blizzard publishes roughly hourly) and skip the DuckDB
  // query entirely, see checkForUpdates()'s own comment.
  if ($("auto").checked) timer = setInterval(checkForUpdates, 60000);
}
$("auto").addEventListener("change", scheduleAuto);

// A realm switch changes what's even in the candidate pool at the SQL/join
// level -- the only filter-rail input that still triggers a real fetch (the
// item-id restriction that used to be the other one was removed 2026-07-27,
// human request).
//
// Goes through checkForUpdates() (paint-from-cache, then a cheap
// /api/status check), not fetchBatch() directly -- switching back to a
// realm already cached and still fresh (same last_modified) used to re-run
// the full expensive /api/snipes query anyway, since fetchBatch() paints
// from cache but always re-fetches regardless (fixed 2026-07-26 -- same
// "don't query if nothing's new" idea the 60s timer and initial page load
// already used, just never extended to a manual switch).
async function onSellRealmChange() {
  const sell = $("sell").value;
  if (!sell) return;
  try { localStorage.setItem(LAST_SELL_KEY, sell); } catch (e) {}
  // A realm with no cache yet must not leave the previously-selected realm's
  // rows on screen -- renderFromCache() only overwrites cachedRows when it
  // actually finds something, so a switch to an uncached realm used to leave
  // the prior realm's rows (and cachedRowsSell) in place, which then made
  // fetchBatch()'s isBackgroundRefresh check think this was a quiet
  // same-realm refresh and skip the loading indicator entirely -- a real
  // report: switching realms showed the old realm's items with no visible
  // loading state while the new one fetched. Clearing here guarantees
  // cachedRows is empty (or genuinely this realm's) before fetchBatch runs.
  if (!renderFromCache(sell)) {
    cachedRows = [];
    cachedRowsSell = sell;
    openGroups.clear();
    renderTable();
  }
  await checkForUpdates();
}
$("sell").addEventListener("change", onSellRealmChange);

// Every other threshold in the rail is a pure re-filter of the already-
// cached batch -- see applyFilters()/renderTable(). "input" fires live as
// the user types/adjusts, not just on blur, matching the instant feel the
// client-side sort already established.
const LIVE_FILTER_IDS = ["min_discount_pct", "min_gold", "max_gold",
                         "min_sell_now", "max_per_item"];
LIVE_FILTER_IDS.forEach(id => $(id).addEventListener("input", () => {
  hideTooltip();
  renderTable();
}));
$("unique_appearance").addEventListener("change", () => {
  hideTooltip();
  renderTable();
});
$("hide_sus_items").addEventListener("change", () => {
  hideTooltip();
  renderTable();
});
ITEM_CLASS_FILTERS.forEach(c => $(`class_${c.key}`).addEventListener("change", () => {
  hideTooltip();
  renderTable();
}));
QUALITY_FILTERS.forEach(q => $(`quality_${q.key}`).addEventListener("change", () => {
  hideTooltip();
  renderTable();
}));

$("logout").addEventListener("click", async () => {
  await fetch("/auth/logout", { method: "POST" }).catch(() => {});
  // localStorage is origin-scoped, not per-account -- clear the cached
  // batches so a different user logging in on this browser never gets an
  // instant paint of the previous account's snipe data, even briefly.
  clearAllCaches();
  window.location.href = "/login";
});

// Theme itself is already set pre-paint by the inline <head> script (avoids
// a flash of the wrong theme); this just wires the toggle and keeps the
// button's icon/label in sync with whichever theme is currently active.
function applyThemeButtonState() {
  const dark = document.documentElement.dataset.theme === "dark";
  const btn = $("theme-toggle");
  btn.textContent = dark ? "☀" : "☽";  // sun to switch to light, moon to switch to dark
  const label = dark ? "Switch to light mode" : "Switch to dark mode";
  btn.title = label;
  btn.setAttribute("aria-label", label);
}
$("theme-toggle").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("theme", next);
  applyThemeButtonState();
});
applyThemeButtonState();

async function loadRealms() {
  try {
    const r = await fetch("/api/realms");
    if (!r.ok) return [];
    const data = await r.json();
    return data.realms || [];
  } catch (e) {
    return [];
  }
}

// Replaces the old free-typed realm-id box -- the server already knows which
// realms it has collected (data/events/{cr}.parquet exists), so pick from
// those instead of guessing an id. `requirePick` (added 2026-07-25, free-
// tier realm lock bugfix): a leading blank placeholder, and defaultSell is
// ignored entirely -- without this, a free-tier account's very first page
// load silently pre-selected and auto-queried whatever realm the server
// happens to be configured with as its site-wide default (/api/config),
// which then became that account's *lock* even though the human never
// actually chose it (caught live, 2026-07-25). Only a genuine, explicit
// dropdown selection should ever be able to set a free-tier lock.
async function populateRealmPicker(defaultSell, requirePick) {
  const realms = await loadRealms();
  const sel = $("sell");
  sel.innerHTML = "";
  if (!realms.length) {
    const opt = document.createElement("option");
    opt.value = defaultSell || "";
    opt.textContent = defaultSell ? `Realm ${defaultSell} (uncollected?)` : "No realms collected yet";
    sel.appendChild(opt);
    return;
  }
  if (requirePick) {
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Choose a sell realm...";
    sel.appendChild(placeholder);
  }
  for (const realm of realms) {
    const opt = document.createElement("option");
    opt.value = realm.id;
    opt.textContent = realm.name;
    sel.appendChild(opt);
  }
  if (!requirePick && defaultSell && realms.some(realm => String(realm.id) === String(defaultSell))) {
    sel.value = String(defaultSell);
  }
}

// Free tier (2026-07-25): the server (dashboard._enforce_realm_lock) locks
// a non-subscribed account to the first sell realm it ever queries. This
// mirrors that lock in the UI *before* the user can attempt a request that
// would 403, rather than letting them find out by trying. If the locked
// realm isn't in the fetched /api/realms list (can happen if the lock was
// set against a realm with no visible data yet), inject it as an option
// anyway -- the UI must reflect what's actually locked server-side, not
// silently show a different realm as selected.
function applyFreeTierRealmLock(lockedSellRealm) {
  const sel = $("sell");
  const hint = $("realm-lock-hint");
  hint.style.display = "block";
  if (lockedSellRealm == null) {
    hint.innerHTML = "Free tier: your first realm choice below will be locked in. " +
      "<a href=\"/pricing\">See plans</a> to query any realm instead.";
    return;
  }
  const lockedStr = String(lockedSellRealm);
  if (![...sel.options].some(opt => opt.value === lockedStr)) {
    const opt = document.createElement("option");
    opt.value = lockedStr;
    opt.textContent = `Realm ${lockedStr}`;
    sel.appendChild(opt);
  }
  sel.value = lockedStr;
  sel.disabled = true;
  hint.innerHTML = "Free tier: locked to this realm. " +
    "<a href=\"/pricing\">See plans</a> to query any realm.";
}

(async function init() {
  // Login alone is the gate now (2026-07-25, free tier) -- no more
  // redirect-to-/subscribe for a logged-in-but-unsubscribed user. The
  // backend (dashboard.py's SNIPE_TIER_CAPS) is what actually enforces the
  // real difference between tiers, by capping row count, not by blocking
  // access outright.
  const me = await fetch("/api/me").catch(() => null);
  if (!me || !me.ok) {
    window.location.href = "/login";
    return;
  }
  const meData = await me.json();
  const isFreeTier = !meData.is_superuser && meData.subscription_status !== "active";
  let defaultSell = null;
  try {
    const r = await fetch("/api/config");
    const cfg = await r.json();
    defaultSell = cfg.default_sell;
  } catch (e) { /* no default, user picks one */ }
  // A browser-remembered last pick beats the site-wide config default --
  // see LAST_SELL_KEY's declaration above. Safe to read unconditionally even
  // for a free-tier-unlocked account: populateRealmPicker() ignores
  // defaultSell entirely when requirePick is true, so this can't defeat that
  // flow's deliberate empty placeholder.
  const rememberedSell = localStorage.getItem(LAST_SELL_KEY);
  if (rememberedSell) defaultSell = rememberedSell;
  // A real per-user lock always wins over both of the above. A free-tier
  // account with no lock yet gets no default at all -- see
  // populateRealmPicker's requirePick param -- since silently pre-selecting
  // a default and auto-querying it is exactly what was setting the lock
  // without a genuine user choice.
  const freeTierUnlocked = isFreeTier && meData.locked_sell_realm == null;
  if (isFreeTier && meData.locked_sell_realm != null) defaultSell = meData.locked_sell_realm;
  await populateRealmPicker(defaultSell, freeTierUnlocked);
  if (isFreeTier) applyFreeTierRealmLock(meData.locked_sell_realm);
  const sell = $("sell").value;
  if (sell) {
    // Instant paint from whatever this browser last cached for this realm --
    // no blank table while checkForUpdates() below decides whether a real
    // fetch is even necessary. On a brand-new browser/first-ever visit
    // there's nothing to paint, and checkForUpdates() falls through to a
    // real fetchBatch() itself.
    renderFromCache(sell);
    await checkForUpdates();
  }
  scheduleAuto();
})();
</script>
</body>
</html>
