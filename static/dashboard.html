<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AH Snipe Dashboard</title>
<style>
  :root {
    color-scheme: dark;
    /* Undermine cartel trading-floor palette: warm industrial black, not
       neutral -- goblin engineering meets a commodities exchange. */
    --bg: #14170f;
    --panel: #1b1f15;
    --panel-raised: #23281a;
    --border: #3a4029;
    --border-bright: #565f38;
    --text: #eef0e6;
    --text-dim: #97a084;
    --toxic: #a6e600;       /* signature accent -- CTAs, active states, ticker */
    --toxic-dim: #7fb300;
    --brass: #c9963e;       /* structural accent -- rules, labels, chrome */
    --ember: #ff7a45;       /* alert / high-value */
    --gold: #ffd651;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 1.5rem; max-width: 1400px; margin-inline: auto;
    background: var(--bg); color: var(--text);
    background-image: radial-gradient(ellipse at top, rgba(166,230,0,0.04), transparent 60%);
  }
  code, .mono, .money, .num { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; }

  /* ---------- Masthead ---------- */
  .masthead { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; margin-bottom: 0.75rem; }
  h1 {
    font-size: 1.5rem; margin: 0; font-weight: 800; letter-spacing: -0.01em;
    text-transform: uppercase; color: var(--text);
  }
  h1 .accent { color: var(--toxic); }
  .nav { display: flex; gap: 0.5rem; }
  .nav a, .nav button {
    background: var(--panel-raised); border: 1px solid var(--border-bright); color: var(--text);
    border-radius: 3px; padding: 0.4rem 0.8rem; cursor: pointer; font-size: 0.78rem;
    text-decoration: none; font-weight: 600; letter-spacing: 0.02em;
  }
  .nav a:hover, .nav button:hover { border-color: var(--brass); color: var(--brass); }

  /* Ticker: the signature element -- a segmented brass-divided status strip,
     static (not scrolling -- respects reduced motion, and a marquee gimmick
     wears out fast on a tool you leave open all day). Every segment is real
     freshness data, not decoration. */
  .ticker {
    display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 1rem;
    background: var(--panel); border: 1px solid var(--border); border-radius: 3px;
    font-size: 0.72rem; overflow: hidden;
  }
  .ticker .seg {
    padding: 0.5rem 0.9rem; border-right: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 0.4rem; white-space: nowrap;
  }
  .ticker .seg:last-child { border-right: none; }
  .ticker .k { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.68rem; }
  .ticker .v { color: var(--text); font-weight: 600; }
  .ticker .v.stale { color: var(--ember); }
  .ticker .v.ok { color: var(--toxic); }

  /* ---------- Control bar ---------- */
  .bar {
    display: flex; flex-wrap: wrap; gap: 1rem; align-items: end;
    margin-bottom: 1rem; padding: 0.85rem 1rem; background: var(--panel);
    border: 1px solid var(--border); border-radius: 4px;
  }
  .bar label {
    display: flex; flex-direction: column; font-size: 0.68rem; color: var(--text-dim);
    gap: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .bar input, .bar select {
    background: var(--bg); border: 1px solid var(--border-bright); color: var(--text);
    border-radius: 3px; padding: 0.4rem 0.55rem; width: 8.5rem; font-size: 0.85rem;
    font-family: inherit;
  }
  .bar select { width: 11rem; }
  .bar input:focus-visible, .bar select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--toxic); outline-offset: 1px; }
  .bar input[type=checkbox] { width: auto; }
  .bar button#refresh {
    background: var(--toxic); border: 1px solid var(--toxic); color: #0f1400;
    border-radius: 3px; padding: 0.45rem 1rem; cursor: pointer; height: fit-content;
    font-weight: 700; text-transform: uppercase; font-size: 0.78rem; letter-spacing: 0.03em;
  }
  .bar button#refresh:hover { background: var(--toxic-dim); border-color: var(--toxic-dim); }
  .bar .auto-label { flex-direction: row; align-items: center; gap: 0.4rem; text-transform: none; letter-spacing: 0; color: var(--text-dim); }

  /* ---------- Ledger table ---------- */
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  th, td { padding: 0.5rem 0.7rem; text-align: right; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3) { text-align: left; }
  th {
    cursor: pointer; user-select: none; color: var(--text-dim); font-weight: 700;
    white-space: nowrap; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.7rem;
    border-bottom: 1px solid var(--border-bright);
  }
  th.active { color: var(--toxic); }
  th .dir { display: inline-block; width: 0.7em; opacity: 0.8; }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:hover { background: var(--panel); }
  tbody tr.sub-row { background: var(--panel); }
  tbody tr.sub-row:hover { background: var(--panel-raised); }
  tbody tr.sub-row td:first-child { position: relative; }
  tbody tr.sub-row td { color: var(--text-dim); }
  .item-cell { display: flex; align-items: center; gap: 0.5rem; cursor: default; }
  .item-cell a { display: flex; line-height: 0; }
  .item-icon { width: 24px; height: 24px; border-radius: 3px; border: 1px solid var(--border-bright); flex-shrink: 0; }
  .item-cell a .item-icon:hover { border-color: var(--toxic); cursor: pointer; }
  .group-toggle {
    background: var(--panel-raised); border: 1px solid var(--border-bright); color: var(--text-dim);
    border-radius: 999px; padding: 0.05rem 0.5rem; font-size: 0.68rem; cursor: pointer;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin-left: 0.2rem;
  }
  .group-toggle:hover { border-color: var(--toxic); color: var(--toxic); }
  .empty { color: var(--text-dim); padding: 1.5rem 0; text-align: center; font-size: 0.85rem; }

  /* ---------- Coin display ---------- */
  .money { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .money-part { display: inline-flex; align-items: center; gap: 3px; margin-right: 7px; }
  .coin {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    box-shadow: inset -1px -1px 1px rgba(0,0,0,0.5), inset 1px 1px 1px rgba(255,255,255,0.35);
  }
  .coin-gold   { background: radial-gradient(circle at 35% 30%, #ffe680, var(--gold) 55%, #b8860b); }
  .coin-silver { background: radial-gradient(circle at 35% 30%, #f4f4f4, #b7b7b7 55%, #7c7c7c); }
  .coin-copper { background: radial-gradient(circle at 35% 30%, #e0985a, var(--brass) 55%, #8a4a1f); }

  /* ---------- Tooltip: styled like a cargo manifest tag ---------- */
  #tooltip {
    position: fixed; z-index: 1000; display: none; pointer-events: none;
    min-width: 220px; max-width: 320px;
    background: var(--panel-raised);
    border: 1px solid var(--brass); border-radius: 3px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.55);
    padding: 0.65rem 0.8rem; font-size: 0.8rem; color: var(--text-dim);
  }
  #tooltip .tt-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.45rem; }
  #tooltip .tt-icon { width: 36px; height: 36px; border-radius: 3px; border: 1px solid var(--border-bright); }
  #tooltip .tt-name { font-weight: 700; font-size: 0.95rem; line-height: 1.2; }
  #tooltip .tt-sub { color: var(--text-dim); font-size: 0.7rem; margin-bottom: 0.4rem; }
  #tooltip .tt-row { display: flex; justify-content: space-between; gap: 1rem; margin: 0.2rem 0; }
  #tooltip .tt-row .lbl { color: var(--text-dim); text-transform: uppercase; font-size: 0.68rem; letter-spacing: 0.04em; }
  #tooltip hr { border: none; border-top: 1px solid var(--border); margin: 0.45rem 0; }

  @media (prefers-reduced-motion: no-preference) {
    tbody tr { transition: background-color 0.1s ease; }
  }
</style>
</head>
<body>
<div class="masthead">
  <h1>AH Snipe <span class="accent">Ledger</span></h1>
  <div class="nav">
    <a href="/profile">Profile</a>
    <button id="logout">Log out</button>
  </div>
</div>

<div class="ticker" id="ticker"></div>

<div class="bar">
  <label>Sell realm <select id="sell"></select></label>
  <label>Min discount % <input id="min_discount_pct" type="number" min="0" max="100" step="5" value="30"></label>
  <label>Min sales/day <input id="min_per_day" type="number" step="0.1" value="0.5"></label>
  <label>Min buy (g) <input id="min_gold" type="number" step="1" min="0" placeholder="any"></label>
  <label>Max buy (g) <input id="max_gold" type="number" step="1" min="0" placeholder="any"></label>
  <label>Item ids (csv) <input id="items" type="text" placeholder="optional"></label>
  <label>Top <input id="top" type="number" value="50"></label>
  <button id="refresh">Refresh</button>
  <label class="auto-label">
    <input id="auto" type="checkbox" checked> Auto-refresh (60s)
  </label>
</div>

<table>
  <thead>
    <tr>
      <th data-sort="buy_realm">Buy realm <span class="dir"></span></th>
      <th data-sort="item">Item <span class="dir"></span></th>
      <th data-sort="variant">Variant <span class="dir"></span></th>
      <th data-sort="buy">Buy <span class="dir"></span></th>
      <th data-sort="gold">Sell p25 <span class="dir"></span></th>
      <th data-sort="per_day">Sales/day <span class="dir"></span></th>
      <th data-sort="discount">Discount % <span class="dir"></span></th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<div id="empty" class="empty" style="display:none;">No snipes at these thresholds.</div>

<div id="tooltip"></div>

<script>
const $ = (id) => document.getElementById(id);
// Table sort is entirely client-side (see renderTable) -- clicking a column
// header never re-fetches, it just re-orders whatever's already loaded. The
// fetch itself always asks the server for the discount-ranked top N (the
// primary "best snipes" ordering); re-sorting by another column reorders
// within that same fetched batch rather than asking the server for a
// differently-ranked top N, which is what makes it instant instead of
// round-tripping on every click.
let sort = "discount";
let sortDir = "desc";
let timer = null;
let currentRows = [];    // raw rows exactly as last fetched from the server
let displayRows = [];    // flattened, on-screen order (main + expanded sub-rows) -- what tooltip lookups index into
let openGroups = new Set();  // group keys the user has expanded to see every listing for that item/variant
let currentRegion = null;
let currentSellSlug = null;

const NUMERIC_SORT_KEYS = new Set(["buy", "gold", "per_day", "discount"]);
const SORT_VALUE = {
  buy_realm: r => (r.buy_realm_name || "").toLowerCase(),
  item: r => (r.name || String(r.item_id)).toLowerCase(),
  variant: r => (r.variant || "").toLowerCase(),
  buy: r => r.buy_copper,
  gold: r => r.sell_copper,
  per_day: r => r.per_day,
  discount: r => r.discount_pct,
};

function compareRows(a, b) {
  const val = SORT_VALUE[sort];
  const va = val(a), vb = val(b);
  const cmp = (typeof va === "number" && typeof vb === "number")
    ? va - vb
    : String(va).localeCompare(String(vb));
  return sortDir === "asc" ? cmp : -cmp;
}

// Multiple listings can snipe the same item/variant (different buy realms,
// or several auctions on one) -- group them so the ledger shows one line per
// item, with the single best deal on top, instead of drowning duplicates.
function groupKey(row) {
  return `${row.item_id}|${row.variant_raw ?? ""}`;
}

function buildGroups(rows) {
  const map = new Map();
  const order = [];
  for (const row of rows) {
    const key = groupKey(row);
    if (!map.has(key)) { map.set(key, []); order.push(key); }
    map.get(key).push(row);
  }
  // Within a group, "biggest snipe" always means highest discount% -- that's
  // fixed regardless of which column the overall table is currently sorted
  // by, since it's what makes one listing the group's best representative.
  return order.map(key => ({
    key,
    rows: map.get(key).slice().sort((a, b) => b.discount_pct - a.discount_pct),
  }));
}

function params() {
  const p = new URLSearchParams();
  p.set("sell", $("sell").value);
  // UI shows/edits a percentage (e.g. 30); the API takes a 0-1 fraction.
  p.set("min_discount", (Number($("min_discount_pct").value) / 100).toString());
  p.set("min_per_day", $("min_per_day").value);
  p.set("top", $("top").value);
  p.set("sort", "discount");
  p.set("names", "true");  // always on -- names/icons aren't worth making optional
  if ($("items").value.trim()) p.set("items", $("items").value.trim());
  if ($("min_gold").value.trim()) p.set("min_gold", $("min_gold").value.trim());
  if ($("max_gold").value.trim()) p.set("max_gold", $("max_gold").value.trim());
  return p;
}

function fmtTs(unixSeconds) {
  if (!unixSeconds) return "never";
  return new Date(unixSeconds * 1000).toLocaleString();
}

function fmtHttpDate(s) {
  if (!s) return "never";
  const d = new Date(s);
  return isNaN(d) ? s : d.toLocaleString();
}

// WoW-style gold/silver/copper coin display, formatted only here at the
// display boundary -- the API sends raw copper end to end.
function formatMoney(copper) {
  copper = Math.round(copper);
  const gold = Math.floor(copper / 10000);
  const silver = Math.floor((copper % 10000) / 100);
  const bronze = copper % 100;
  const parts = [];
  if (gold > 0) parts.push(`<span class="money-part">${gold}<span class="coin coin-gold"></span></span>`);
  if (gold > 0 || silver > 0) parts.push(`<span class="money-part">${silver}<span class="coin coin-silver"></span></span>`);
  parts.push(`<span class="money-part">${bronze}<span class="coin coin-copper"></span></span>`);
  return `<span class="money">${parts.join("")}</span>`;
}

function undermineUrl(row) {
  if (!currentRegion || !currentSellSlug) return null;
  return `https://undermine.exchange/#${currentRegion}-${currentSellSlug}/${row.item_id}`;
}

function showTooltip(row, x, y) {
  const tt = $("tooltip");
  const color = row.quality_color || "#ffffff";
  const icon = row.icon
    ? `<img class="tt-icon" src="${row.icon}" alt="" onerror="this.style.display='none'">`
    : "";
  const ue = undermineUrl(row);
  tt.innerHTML = `
    <div class="tt-head">
      ${icon}
      <div>
        <div class="tt-name" style="color:${color}">${row.name ?? ("item " + row.item_id)}</div>
        <div class="tt-sub">Item ${row.item_id}${row.variant_raw ? " &middot; " + row.variant : ""}</div>
      </div>
    </div>
    <div class="tt-row"><span class="lbl">Buy realm</span><span>${row.buy_realm_name}</span></div>
    <div class="tt-row"><span class="lbl">Buy price</span>${formatMoney(row.buy_copper)}</div>
    <div class="tt-row"><span class="lbl">Sell p25</span>${formatMoney(row.sell_copper)}</div>
    <div class="tt-row"><span class="lbl">Sales/day</span><span>${row.per_day.toFixed(2)}</span></div>
    <div class="tt-row"><span class="lbl">Discount</span><span>${row.discount_pct.toFixed(1)}%</span></div>
    ${ue ? `<hr><div class="tt-sub">Click the icon for Undermine Exchange &rarr;</div>` : ""}
  `;
  tt.style.display = "block";
  positionTooltip(x, y);
}

function positionTooltip(x, y) {
  const tt = $("tooltip");
  const pad = 14;
  let left = x + pad, top = y + pad;
  const rect = tt.getBoundingClientRect();
  if (left + rect.width > window.innerWidth) left = x - rect.width - pad;
  if (top + rect.height > window.innerHeight) top = y - rect.height - pad;
  tt.style.left = `${Math.max(0, left)}px`;
  tt.style.top = `${Math.max(0, top)}px`;
}

function hideTooltip() {
  $("tooltip").style.display = "none";
}

async function loadStatus(sell) {
  if (!sell) return;
  try {
    const r = await fetch(`/api/status?sell=${encodeURIComponent(sell)}`);
    if (!r.ok) return;
    const s = await r.json();
    const now = new Date().toLocaleTimeString();
    const stale = !s.events_exist;
    $("ticker").innerHTML = `
      <div class="seg"><span class="k">Polled</span><span class="v mono">${now}</span></div>
      <div class="seg"><span class="k">Snapshot</span><span class="v mono ${stale ? "stale" : "ok"}">${fmtHttpDate(s.last_modified)}</span></div>
      <div class="seg"><span class="k">Listings swept</span><span class="v mono">${fmtTs(s.listings_updated)}</span></div>
      <div class="seg"><span class="k">Ledger</span><span class="v mono ${stale ? "stale" : "ok"}">${s.events_exist ? "built" : "pending"}</span></div>
    `;
  } catch (e) { /* leave last-known status visible */ }
}

function buildRowHtml(row, idx, group, isSub) {
  const color = row.quality_color || "inherit";
  const ue = undermineUrl(row);
  let icon = "";
  if (row.icon) {
    const img = `<img class="item-icon" src="${row.icon}" alt="" onerror="this.style.display='none'">`;
    icon = ue
      ? `<a href="${ue}" target="_blank" rel="noopener" title="View ${row.name ?? row.item_id} on Undermine Exchange">${img}</a>`
      : img;
  }
  const toggle = (group && group.rows.length > 1)
    ? `<button class="group-toggle" data-group="${group.key}" title="${group.rows.length} listings for this item -- click to see them all, best first">${openGroups.has(group.key) ? "&#9652;" : "&#9662;"} ${group.rows.length}</button>`
    : "";
  return `
    <tr class="${isSub ? "sub-row" : ""}">
      <td title="realm ${row.buy_realm}">${row.buy_realm_name}</td>
      <td><div class="item-cell" data-row="${idx}">${icon}<span style="color:${color}">${row.name ?? row.item_id}</span>${toggle}</div></td>
      <td class="mono" title="${row.variant_raw ?? ""}">${row.variant}</td>
      <td class="num">${formatMoney(row.buy_copper)}</td>
      <td class="num">${formatMoney(row.sell_copper)}</td>
      <td class="num">${row.per_day.toFixed(2)}</td>
      <td class="num">${row.discount_pct.toFixed(1)}</td>
    </tr>`;
}

// Pure re-render of whatever's already in currentRows -- no network call, so
// clicking a column header or expanding a group is instant (the "lag" fixed
// here was every sort click round-tripping to /api/snipes just to reorder
// rows the browser already had).
function renderTable() {
  const groups = buildGroups(currentRows);
  groups.sort((a, b) => compareRows(a.rows[0], b.rows[0]));

  displayRows = [];
  const html = [];
  groups.forEach(group => {
    const best = group.rows[0];
    displayRows.push(best);
    html.push(buildRowHtml(best, displayRows.length - 1, group, false));
    if (openGroups.has(group.key)) {
      group.rows.slice(1).forEach(row => {
        displayRows.push(row);
        html.push(buildRowHtml(row, displayRows.length - 1, null, true));
      });
    }
  });

  $("rows").innerHTML = html.join("");
  $("empty").style.display = groups.length ? "none" : "block";
  $("empty").textContent = "No snipes at these thresholds.";

  document.querySelectorAll("th[data-sort]").forEach(th => {
    const active = th.dataset.sort === sort;
    th.classList.toggle("active", active);
    const dirEl = th.querySelector(".dir");
    if (dirEl) dirEl.textContent = active ? (sortDir === "asc" ? "▲" : "▼") : "";
  });
}

async function loadSnipes() {
  const sell = $("sell").value;
  if (!sell) return;
  const r = await fetch(`/api/snipes?${params().toString()}`);
  if (r.status === 401) { window.location.href = "/login"; return; }
  if (r.status === 402) { window.location.href = "/subscribe"; return; }
  if (!r.ok) {
    const err = await r.json().catch(() => ({detail: r.statusText}));
    currentRows = [];
    openGroups.clear();
    renderTable();
    $("empty").textContent = err.detail || "error loading snipes";
    hideTooltip();
    return;
  }
  const data = await r.json();
  // data.caveat (the warband/BoP note) is intentionally not displayed --
  // removed from the UI per product decision; still in the API response.
  currentRegion = data.region;
  currentSellSlug = data.sell_realm_slug;
  currentRows = data.rows;
  openGroups.clear();  // fresh fetch -- collapse groups back to best-first summaries
  renderTable();
  await loadStatus(sell);
}

document.getElementById("rows").addEventListener("mouseover", (e) => {
  const cell = e.target.closest(".item-cell");
  if (!cell) return;
  const row = displayRows[Number(cell.dataset.row)];
  if (row) showTooltip(row, e.clientX, e.clientY);
});
document.getElementById("rows").addEventListener("mousemove", (e) => {
  const cell = e.target.closest(".item-cell");
  if (cell && $("tooltip").style.display === "block") positionTooltip(e.clientX, e.clientY);
});
document.getElementById("rows").addEventListener("mouseout", (e) => {
  if (e.target.closest(".item-cell") && !e.relatedTarget?.closest(".item-cell")) hideTooltip();
});
document.getElementById("rows").addEventListener("click", (e) => {
  const btn = e.target.closest(".group-toggle");
  if (!btn) return;
  const key = btn.dataset.group;
  if (openGroups.has(key)) openGroups.delete(key); else openGroups.add(key);
  hideTooltip();
  renderTable();
});

document.querySelectorAll("th[data-sort]").forEach(th => {
  th.addEventListener("click", () => {
    const col = th.dataset.sort;
    if (sort === col) {
      sortDir = sortDir === "asc" ? "desc" : "asc";
    } else {
      sort = col;
      sortDir = NUMERIC_SORT_KEYS.has(col) ? "desc" : "asc";
    }
    renderTable();
  });
});

$("refresh").addEventListener("click", loadSnipes);

function scheduleAuto() {
  if (timer) clearInterval(timer);
  if ($("auto").checked) timer = setInterval(loadSnipes, 60000);
}
$("auto").addEventListener("change", scheduleAuto);

$("logout").addEventListener("click", async () => {
  await fetch("/auth/logout", { method: "POST" }).catch(() => {});
  window.location.href = "/login";
});

async function loadRealms() {
  try {
    const r = await fetch("/api/realms");
    if (!r.ok) return [];
    const data = await r.json();
    return data.realms || [];
  } catch (e) {
    return [];
  }
}

// Replaces the old free-typed realm-id box -- the server already knows which
// realms it has collected (data/events/{cr}.parquet exists), so pick from
// those instead of guessing an id.
async function populateRealmPicker(defaultSell) {
  const realms = await loadRealms();
  const sel = $("sell");
  sel.innerHTML = "";
  if (!realms.length) {
    const opt = document.createElement("option");
    opt.value = defaultSell || "";
    opt.textContent = defaultSell ? `Realm ${defaultSell} (uncollected?)` : "No realms collected yet";
    sel.appendChild(opt);
    return;
  }
  for (const realm of realms) {
    const opt = document.createElement("option");
    opt.value = realm.id;
    opt.textContent = realm.name;
    sel.appendChild(opt);
  }
  if (defaultSell && realms.some(realm => String(realm.id) === String(defaultSell))) {
    sel.value = String(defaultSell);
  }
}

(async function init() {
  const me = await fetch("/api/me").catch(() => null);
  if (!me || !me.ok) {
    window.location.href = "/login";
    return;
  }
  const meData = await me.json();
  if (!meData.is_superuser && meData.subscription_status !== "active") {
    window.location.href = "/subscribe";
    return;
  }
  let defaultSell = null;
  try {
    const r = await fetch("/api/config");
    const cfg = await r.json();
    defaultSell = cfg.default_sell;
  } catch (e) { /* no default, user picks one */ }
  await populateRealmPicker(defaultSell);
  if ($("sell").value) await loadSnipes();
  scheduleAuto();
})();
</script>
</body>
</html>
