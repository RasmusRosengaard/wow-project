<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>+Speed Scan — Realm Arbitrage</title>
<!-- noindex while this is experimental, same reasoning as watchlist.html:
     an indexed half-finished tool is a thin-content signal against the whole
     site. Drop this tag (and add /speed to sitemap.xml) when it graduates. -->
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script>
  (function () {
    var saved = localStorage.getItem("theme");
    var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --paper: #f6f7f5;
    --card: #ffffff;
    --hairline: #d8dbd4;
    --hairline-strong: #c3c8bd;
    --ink: #14161a;
    --text-dim: #5b6259;
    --bullion: #a67c2e;
    --bullion-dim: #8a6624;
    --verified: #2f7d72;
    --verified-bg: rgba(47,125,114,0.08);
    --alert: #b0392f;
    --alert-bg: rgba(176,57,47,0.08);
    --coin-gold: #d4af37; --coin-silver: #b7b7b7; --coin-copper: #b87333;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #14161a;
    --card: #1b1e24;
    --hairline: #333844;
    --hairline-strong: #454b59;
    --ink: #e8eaed;
    --text-dim: #8b93a3;
    --bullion: #d4af61;
    --bullion-dim: #b8934f;
    --verified: #3fa9a0;
    --verified-bg: rgba(63,169,160,0.14);
    --alert: #e0645a;
    --alert-bg: rgba(224,100,90,0.14);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: var(--paper); color: var(--ink); min-height: 100vh;
  }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; padding: 1rem 1.5rem; background: var(--card);
    border-bottom: 1px solid var(--hairline-strong);
  }
  .brand { display: flex; align-items: center; gap: 0.6rem; }
  .brand-link { display: contents; text-decoration: none; color: inherit; }
  .brand h1 {
    font-size: 1.05rem; margin: 0; font-weight: 800; letter-spacing: -0.01em;
    text-transform: uppercase; color: var(--ink);
  }
  .seal { --coin: var(--bullion); --line: var(--ink); flex-shrink: 0; }
  .nav { display: flex; gap: 0.4rem; align-items: center; }
  .nav a, .nav button {
    background: transparent; border: 1px solid transparent; color: var(--text-dim);
    border-radius: 4px; padding: 0.45rem 0.8rem; cursor: pointer; font-size: 0.8rem;
    text-decoration: none; font-weight: 600; font-family: inherit; text-transform: none;
    transition: background-color 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .nav a:hover, .nav button:hover { background: var(--paper); border-color: var(--hairline-strong); color: var(--ink); }
  .nav a.active { color: var(--bullion); font-weight: 700; cursor: default; }
  .nav a.active:hover { background: transparent; border-color: transparent; }
  #theme-toggle { font-size: 1rem; line-height: 1; padding: 0.45rem 0.6rem; }

  .shell { display: flex; justify-content: center; padding: 2rem 1.5rem 3rem; }
  .wrap { max-width: 1600px; width: 100%; display: flex; flex-direction: column; gap: 1.5rem; }
  h2 { font-size: 1.1rem; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
  .card {
    background: var(--card); border: 1px solid var(--hairline); border-radius: 6px;
    padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 0.9rem;
  }
  .card p { margin: 0; font-size: 0.85rem; line-height: 1.6; color: var(--text-dim); }
  .upsell { font-size: 0.9rem; }
  .upsell a { color: var(--bullion); font-weight: 700; text-decoration: none; }
  .upsell a:hover { text-decoration: underline; }
  label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); }
  input[type=text], input[type=number], .field select {
    background: var(--paper); border: 1px solid var(--hairline-strong); color: var(--ink);
    border-radius: 3px; padding: 0.5rem 0.6rem; font-size: 0.85rem; font-family: inherit; width: 100%;
  }
  button {
    background: var(--bullion); border: 1px solid var(--bullion); color: #fff;
    border-radius: 3px; padding: 0.55rem 1rem; cursor: pointer; font-size: 0.8rem;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    font-family: inherit; white-space: nowrap;
  }
  button:hover { background: var(--bullion-dim); border-color: var(--bullion-dim); }
  button:disabled { opacity: 0.55; cursor: default; }
  .row { display: flex; gap: 0.6rem; align-items: flex-end; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 0.3rem; }
  .field.narrow { width: 120px; }
  /* .field.sort-field (a 175px widening for the item-level select, whose
     longest option used to be "253 + 266 (tracked)") was dropped on
     2026-08-13 -- its options are now "266"/"253" and fit the shared 120px
     width. Re-add it for any wide control: the lesson that outlived it is
     that an option clipping inside 120px is only ever caught in a browser,
     never in the diff. */
  .field.grow { flex: 1; min-width: 140px; }
  .error { color: var(--alert); font-size: 0.8rem; min-height: 1em; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th { text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--hairline-strong); white-space: nowrap; }
  td { padding: 0.5rem; border-bottom: 1px solid var(--hairline); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  th.num, td.num { text-align: right; }
  .item-cell { display: flex; align-items: center; gap: 0.55rem; min-width: 0; }
  .item-icon { width: 26px; height: 26px; border-radius: 4px; flex-shrink: 0; border: 1px solid var(--hairline-strong); box-shadow: inset 0 0 0 3px var(--q, transparent); background: var(--paper); }
  .item-name { font-weight: 600; }
  /* Money renders as WoW gold/silver/copper coins, copied from
     dashboard.html rather than reinvented -- a plain localized number is
     genuinely ambiguous here (a da-DK browser renders 25,000g as "25.000",
     indistinguishable at a glance from this page's real sub-gold prices
     like 0.01), and the rest of the product already speaks coins. */
  .money { white-space: nowrap; font-variant-numeric: tabular-nums;
           font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; }
  .money-part { display: inline-flex; align-items: center; gap: 3px; margin-right: 7px; }
  .coin {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    box-shadow: inset -1px -1px 1px rgba(0,0,0,0.35), inset 1px 1px 1px rgba(255,255,255,0.5);
  }
  .coin-gold   { background: radial-gradient(circle at 35% 30%, #f3d78a, var(--coin-gold) 55%, #a3821f); }
  .coin-silver { background: radial-gradient(circle at 35% 30%, #f4f4f4, var(--coin-silver) 55%, #7c7c7c); }
  .coin-copper { background: radial-gradient(circle at 35% 30%, #dba573, var(--coin-copper) 55%, #7a4a20); }
  td.num .money { display: inline-flex; justify-content: flex-end; }
  .muted { color: var(--text-dim); }
  .variant { font-size: 0.75rem; color: var(--text-dim); }
  .ilvl { font-weight: 700; font-variant-numeric: tabular-nums; }
  .account { font-size: 0.8rem; color: var(--verified); font-weight: 600; }
  .item-cell a { display: inline-flex; text-decoration: none; }
  .item-cell a:hover .item-icon { border-color: var(--bullion); }
  .count { font-size: 0.8rem; color: var(--text-dim); }
  /* Only rendered when a scan returns nothing -- an empty table on its own
     reads as a broken page, which is what the old combined ilvl label caused.
     Empty string when there are rows, so it collapses to nothing. */
  .empty-note { font-size: 0.8rem; color: var(--text-dim); line-height: 1.5; margin-top: 0.35rem; max-width: 60ch; }
  /* Freshness sits directly under the result count, not in a topbar ticker
     like dashboard.html's: there it describes a realm you picked, here it
     describes the one region sweep every row on the page came from. */
  .collected { font-size: 0.8rem; color: var(--text-dim); }
  .collected .age { font-weight: 700; color: var(--ink); }
  /* Blizzard republishes hourly, so past ~90 minutes the sweep is behind at
     least one publish and rows may already be bought. */
  .collected .age.stale { color: var(--alert); }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <a href="/" class="brand-link" aria-label="Realm Arbitrage home">
    <svg class="seal" width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
      <defs>
        <mask id="seal-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
          <rect width="32" height="32" fill="#fff"/>
          <circle cx="16" cy="16" r="6.4" fill="none" stroke="#7a7a7a" stroke-width="0.7"/>
          <g stroke="#000" stroke-width="1.5" stroke-linecap="round">
            <line x1="16" y1="6" x2="16" y2="12.4"/>
            <line x1="16" y1="19.6" x2="16" y2="26"/>
            <line x1="6" y1="16" x2="12.4" y2="16"/>
            <line x1="19.6" y1="16" x2="26" y2="16"/>
          </g>
          <circle cx="16" cy="16" r="1.5" fill="#000"/>
        </mask>
      </defs>
      <circle cx="16" cy="16" r="12.2" fill="none" stroke="var(--line)" stroke-width="0.9" opacity="0.55"/>
      <circle cx="16" cy="16" r="9" fill="var(--coin)" mask="url(#seal-cut)"/>
      <g stroke="var(--line)" stroke-width="1.5" stroke-linecap="round">
        <line x1="16" y1="1.5" x2="16" y2="6.2"/>
        <line x1="16" y1="25.8" x2="16" y2="30.5"/>
        <line x1="1.5" y1="16" x2="6.2" y2="16"/>
        <line x1="25.8" y1="16" x2="30.5" y2="16"/>
      </g>
    </svg>
    <h1>Realm Arbitrage</h1>
    </a>
  </div>
  <div class="nav">
    <button id="theme-toggle" title="Switch to dark mode" aria-label="Switch to dark mode">&#9789;</button>
    <a href="/snipes">Dashboard</a>

    <a href="/watchlist">Watchlist</a>

<div class="shell">
<div class="wrap">
  <div>
    <h2>+Speed Scan</h2>
  </div>

  <div id="logged-out-card" class="card" style="display:none;">
    <p class="upsell">Log in to use the +Speed scan. <a href="/login">Log in &rarr;</a></p>
  </div>

  <div id="unverified-card" class="card" style="display:none;">
    <p class="upsell">Confirm your email address to use the +Speed scan. <a href="/profile">Profile &rarr;</a></p>
  </div>

  <div id="app" style="display:none;">
    <div class="card">
      <div class="row">
        <!-- Item level: exactly two options, 266 and 253, one at a time
             (2026-08-13, human: "NEVERSHOW 220, ONLY266", then "frontend
             should be able to search for these 253 items also" / "only
             return speed items with 266 or 253"). Deliberately NOT the old
             "253 + 266 (tracked)" combined default, and deliberately not
             `Any`:

             253 currently returns **nothing**, because no listing carrying
             the 253 upgrade id also carries the +Speed bonus anywhere in the
             region sweep. The level is real (see speed_check.ILVL_BONUS_IDS
             -- the human bought one), the intersection is just empty today,
             and the combined label hid that behind 266's rows for a day.
             Kept as its own option so it fills in by itself the moment a
             +Speed 253 is posted; #empty-note (set in runScan) says so
             rather than leaving a bare empty table.

             Hardcoded here rather than built from the API's `known_ilvls`,
             which lists every level ILVL_BONUS_IDS knows (220, 198, 192...)
             -- same convention as the armor options below, whose real home
             is speed_check.ARMOR_TYPES. -->
        <div class="field narrow">
          <label for="ilvl">Item level</label>
          <select id="ilvl">
            <option value="266">266</option>
            <option value="253">253</option>
          </select>
        </div>
        <div class="field narrow">
          <label for="armor">Armor type</label>
          <select id="armor">
            <option value="">All</option>
            <option value="cloth">Cloth</option>
            <option value="leather">Leather</option>
            <option value="mail">Mail</option>
            <option value="plate">Plate</option>
            <option value="jewelry">Jewelry</option>
            <option value="shield">Shield</option>
            <option value="weapon">Weapon</option>
          </select>
        </div>
        <button id="run-btn">Scan</button>
      </div>
      <div class="error" id="error"></div>
      <div class="count" id="count"></div>
      <div class="empty-note" id="empty-note"></div>
      <div class="collected" id="collected"></div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th class="num">ilvl</th>
              <th>Realm</th>
              <th>Account</th>
              <th class="num">Price</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>

<script>
const $ = (id) => document.getElementById(id);

function showLoggedOut() { $("logged-out-card").style.display = "flex"; }
function showUnverified() { $("unverified-card").style.display = "flex"; }

// WoW gold/silver/copper, formatted only at this display boundary -- the API
// sends raw copper end to end (CLAUDE.md's units rule). Built as DOM nodes
// rather than dashboard.html's innerHTML template string: this page renders
// every cell via textContent, and keeping one escaping discipline throughout
// is easier to hold than two.
function moneyEl(copper) {
  const span = document.createElement("span");
  if (copper === null || copper === undefined) { span.textContent = "—"; return span; }
  copper = Math.round(copper);
  const gold = Math.floor(copper / 10000);
  const silver = Math.floor((copper % 10000) / 100);
  const bronze = copper % 100;
  span.className = "money";
  const part = (value, coinClass) => {
    const p = document.createElement("span");
    p.className = "money-part";
    p.appendChild(document.createTextNode(String(value)));
    const c = document.createElement("span");
    c.className = "coin " + coinClass;
    p.appendChild(c);
    span.appendChild(p);
  };
  if (gold > 0) part(gold.toLocaleString(), "coin-gold");
  if (gold > 0 || silver > 0) part(silver, "coin-silver");
  part(bronze, "coin-copper");
  return span;
}

// Rarity is shown as the inset ring around the icon, never as the item
// name's text colour -- dashboard.html made that call deliberately because
// most of Blizzard's quality palette fails contrast as text on this design's
// light "paper" background. Same reasoning applies here.
// realm id -> [account label]. Populated from /api/wow-accounts, the same
// source dashboard.html cross-references against its snipe rows. Kept out of
// any cached row payload deliberately, same reasoning as there: these are the
// user's own account labels, not shared data.
let userRealmAccounts = new Map();
let currentRegion = null;

async function loadUserRealmAccounts() {
  try {
    const r = await fetch("/api/wow-accounts");
    // 402 free tier / 401 logged out -- Map stays empty and the column
    // shows "—" rather than the page failing.
    if (!r.ok) return;
    const data = await r.json();
    const map = new Map();
    for (const acct of data.accounts || []) {
      for (const realmId of acct.realms || []) {
        if (!map.has(realmId)) map.set(realmId, []);
        map.get(realmId).push(acct.label);
      }
    }
    userRealmAccounts = map;
  } catch (e) { /* leave Map empty */ }
}

// Blizzard republishes auction data roughly hourly and the region scanner
// sweeps on its own cadence, so "how old is this" is the difference between a
// buyable listing and one someone already took. Shown as an age plus the
// absolute local time, since a bare timestamp makes the reader do the
// subtraction and a bare age hides which publish it came from.
const STALE_AFTER_MINUTES = 90;

function renderCollected(ts, isPublish) {
  const el = $("collected");
  if (!ts) { el.textContent = ""; return; }
  const when = new Date(ts * 1000);
  const mins = Math.max(0, Math.round((Date.now() - when.getTime()) / 60000));
  // Days above 48h -- "483h 15m ago" is technically right and useless to
  // read. Production data is minutes old, but a stalled collector is exactly
  // when this line matters most, so it has to stay legible when very old.
  const age = mins < 1 ? "just now"
    : mins < 60 ? mins + " min ago"
    : mins < 2880 ? Math.floor(mins / 60) + "h " + (mins % 60) + "m ago"
    : Math.floor(mins / 1440) + "d " + Math.floor((mins % 1440) / 60) + "h ago";
  el.textContent = "";
  // "published" is Blizzard's own publish moment -- the same number /snipes
  // shows as "Last auction data", so the two pages agree. Falls back to
  // "collected" wording when only our fetch time is known, rather than
  // labelling a fetch time as a publish.
  el.appendChild(document.createTextNode(
    isPublish ? "Auction data published " : "Auction data collected "));
  const span = document.createElement("span");
  span.className = "age" + (mins > STALE_AFTER_MINUTES ? " stale" : "");
  span.textContent = age;
  el.appendChild(span);
  el.appendChild(document.createTextNode(" — " + when.toLocaleString()
    + (mins > STALE_AFTER_MINUTES ? " (Blizzard republishes hourly; listings may be gone)" : "")));
}

function undermineUrl(row) {
  if (!currentRegion || !row.realm_slug) return null;
  return "https://undermine.exchange/#" + currentRegion + "-" + row.realm_slug + "/" + row.item_id;
}

const QUALITY_COLORS = {
  POOR: "#9d9d9d", COMMON: "#ffffff", UNCOMMON: "#1eff00", RARE: "#0070dd",
  EPIC: "#a335ee", LEGENDARY: "#ff8000", ARTIFACT: "#e6cc80", HEIRLOOM: "#00ccff",
};

function renderRows(rows) {
  const tbody = $("rows");
  tbody.innerHTML = "";
  if (!rows.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 5;
    td.className = "muted";
    td.textContent = "No +Speed listings matched.";
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }
  for (const r of rows) {
    const tr = document.createElement("tr");

    const itemTd = document.createElement("td");
    const cell = document.createElement("div");
    cell.className = "item-cell";
    if (r.icon) {
      const img = document.createElement("img");
      img.className = "item-icon";
      img.src = r.icon;
      img.alt = "";
      img.loading = "lazy";
      if (r.quality && QUALITY_COLORS[r.quality]) img.style.setProperty("--q", QUALITY_COLORS[r.quality]);
      // Icon links to Undermine Exchange, same convention as the Dashboard.
      // Difference: that page anchors on the *sell* realm, which doesn't
      // exist here, so each row links to the realm the listing is actually
      // on -- the one you'd be checking a price history for.
      const url = undermineUrl(r);
      if (url) {
        const a = document.createElement("a");
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.title = "Price history on Undermine Exchange (" + r.realm_name + ")";
        a.appendChild(img);
        cell.appendChild(a);
      } else {
        cell.appendChild(img);
      }
    }
    const nameWrap = document.createElement("div");
    const nameEl = document.createElement("div");
    nameEl.className = "item-name";
    // textContent, never innerHTML: item names come from the Blizzard API,
    // but the variant string and anything else here still goes through the
    // same discipline the rest of the app uses.
    nameEl.textContent = r.name || String(r.item_id);
    const variantEl = document.createElement("div");
    variantEl.className = "variant";
    variantEl.textContent = r.variant || "";
    variantEl.title = r.variant_raw || "";
    nameWrap.appendChild(nameEl);
    nameWrap.appendChild(variantEl);
    cell.appendChild(nameWrap);
    itemTd.appendChild(cell);
    tr.appendChild(itemTd);

    const ilvlTd = document.createElement("td");
    ilvlTd.className = "num ilvl";
    ilvlTd.textContent = r.ilvl === null || r.ilvl === undefined ? "—" : r.ilvl;
    tr.appendChild(ilvlTd);

    const realmTd = document.createElement("td");
    realmTd.textContent = r.realm_name;
    if (r.realm_category) realmTd.title = r.realm_category;
    tr.appendChild(realmTd);

    const acctTd = document.createElement("td");
    const labels = userRealmAccounts.get(r.realm) || [];
    if (labels.length) {
      acctTd.className = "account";
      acctTd.textContent = labels.join(", ");
    } else {
      acctTd.className = "muted";
      acctTd.textContent = "—";
    }
    tr.appendChild(acctTd);

    const priceTd = document.createElement("td");
    priceTd.className = "num";
    priceTd.appendChild(moneyEl(r.price_copper));
    tr.appendChild(priceTd);



    tbody.appendChild(tr);
  }
}

async function runScan() {
  const btn = $("run-btn");
  btn.disabled = true;
  $("error").textContent = "";
  $("empty-note").textContent = "";
  $("count").textContent = "Scanning every EU realm's listings…";
  // Trimmed to two controls plus Scan (2026-08-12, human: "just keep the
  // 253 + 266 and armortype and scan"). Everything else the API still
  // supports -- sort, min/max gold, min gap, item ids, quality, top -- is
  // fixed here rather than removed from the backend, so `speed_check.py`'s
  // CLI keeps the full set. Tarnished is now permanent rather than a
  // checkbox: this page IS the Midnight view.
  const ilvl = $("ilvl").value;
  const params = new URLSearchParams({
    tarnished: "true",
    sort: "price",   // cheapest first; the buy price is the decision
    top: "100",
    names: "true",
    // Always sent as a literal level rather than `tracked=true`, so the
    // request says which tier it means and the two options stay symmetric.
    ilvl: ilvl,
  });
  if ($("armor").value) params.set("armor", $("armor").value);
  try {
    const res = await fetch("/api/speed?" + params.toString());
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || ("request failed (" + res.status + ")"));
    }
    const data = await res.json();
    currentRegion = data.region;
    renderRows(data.rows);
    renderCollected(data.collected_ts, data.collected_is_publish);
    const scope = data.name_filter ? ' matching "' + data.name_filter + '"' : "";
    $("count").textContent = data.count + " +Speed listing(s)" + scope
      + " at ilvl " + ilvl + " — bonus id " + data.bonus_id + ", " + data.region.toUpperCase();
    // An empty table is ambiguous -- "is the page broken?" was exactly the
    // confusion the old combined "253 + 266" label caused. Say which of the
    // two filters emptied it.
    $("empty-note").textContent = data.count ? "" :
      ("No listing at ilvl " + ilvl + " currently carries the +Speed bonus anywhere in EU."
       + (ilvl === "253"
          ? " ilvl 253 is real and plentiful on the auction house, but none of it has +Speed"
            + " in this sweep — this view fills in on its own the moment one is posted."
          : ""));
  } catch (e) {
    $("error").textContent = e.message;
    $("count").textContent = "";
    $("empty-note").textContent = "";
  } finally {
    btn.disabled = false;
  }
}

$("run-btn").addEventListener("click", runScan);

(async function init() {
  const me = await fetch("/api/me").catch(() => null);
  if (!me || !me.ok) { showLoggedOut(); applyThemeButtonState(); return; }
  const data = await me.json();
  // /api/me returns 200 for anonymous visitors too (see dashboard.py) --
  // .ok alone doesn't mean logged in, same trap watchlist.html documents.
  if (data.is_anonymous) { showLoggedOut(); applyThemeButtonState(); return; }
  $("nav-pricing").remove();
  $("nav-login").remove();
  $("nav-profile").style.display = "inline-block";
  $("nav-logout").style.display = "inline-block";

  // Mirrors /api/speed's own 403: a password account that never clicked the
  // confirmation link can log in nowhere anyway (2026-08-09 gate), but an
  // account can also reach this page mid-flow.
  if (data.is_verified === false) { showUnverified(); applyThemeButtonState(); return; }

  $("app").style.display = "block";
  applyThemeButtonState();
  // Must resolve before the first runScan() so the very first paint already
  // has account labels, not just later re-renders (same ordering
  // dashboard.html relies on).
  await loadUserRealmAccounts();
  await runScan();
})();

$("nav-logout").addEventListener("click", async () => {
  await fetch("/auth/logout", { method: "POST" }).catch(() => {});
  window.location.href = "/login";
});

function applyThemeButtonState() {
  const dark = document.documentElement.dataset.theme === "dark";
  const btn = $("theme-toggle");
  btn.textContent = dark ? "☀" : "☽";
  const label = dark ? "Switch to light mode" : "Switch to dark mode";
  btn.title = label;
  btn.setAttribute("aria-label", label);
}
$("theme-toggle").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("theme", next);
  applyThemeButtonState();
});
applyThemeButtonState();
</script>
</body>
</html>
