<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snipe Board — Realm Arbitrage</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script>
  (function () {
    var saved = localStorage.getItem("theme");
    var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --paper: #f6f7f5;
    --card: #ffffff;
    --hairline: #d8dbd4;
    --hairline-strong: #c3c8bd;
    --ink: #14161a;
    --text-dim: #5b6259;
    --bullion: #a67c2e;
    --bullion-dim: #8a6624;
    --verified: #2f7d72;
    --alert: #b0392f;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #14161a;
    --card: #1b1e24;
    --hairline: #333844;
    --hairline-strong: #454b59;
    --ink: #e8eaed;
    --text-dim: #8b93a3;
    --bullion: #d4af61;
    --bullion-dim: #b8934f;
    --verified: #3fa9a0;
    --alert: #e0645a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: var(--paper); color: var(--ink); min-height: 100vh;
  }
  code, .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; padding: 1rem 1.5rem; background: var(--card);
    border-bottom: 1px solid var(--hairline-strong);
  }
  .brand { display: flex; align-items: center; gap: 0.6rem; }
  .brand-link { display: contents; text-decoration: none; color: inherit; }
  .brand h1 {
    font-size: 1.05rem; margin: 0; font-weight: 800; letter-spacing: -0.01em;
    text-transform: uppercase; color: var(--ink);
  }
  .seal { color: var(--verified); flex-shrink: 0; }
  .nav { display: flex; gap: 0.4rem; align-items: center; }
  .nav a, .nav button {
    background: transparent; border: 1px solid transparent; color: var(--text-dim);
    border-radius: 4px; padding: 0.45rem 0.8rem; cursor: pointer; font-size: 0.8rem;
    text-decoration: none; font-weight: 600; font-family: inherit;
    transition: background-color 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .nav a:hover, .nav button:hover { background: var(--paper); border-color: var(--hairline-strong); color: var(--ink); }
  /* The current page's own nav link -- shown, not omitted, so the nav's set
     of items (and therefore its width/layout) never changes page to page --
     an omitted self-link used to make the whole bar visibly shift depending
     on which page you were on (2026-07-30 human report). */
  .nav a.active { color: var(--bullion); font-weight: 700; cursor: default; }
  .nav a.active:hover { background: transparent; border-color: transparent; }
  #theme-toggle { font-size: 1rem; line-height: 1; padding: 0.45rem 0.6rem; }

  .shell { display: flex; justify-content: center; padding: 2rem 1.5rem; }
  /* Wide, like dashboard.html's shell -- this is a photo board, not a plain
     log/table (log.html's 640px column this used to copy), so it should
     actually use the screen's width instead of floating in the middle of it. */
  .wrap { max-width: 1400px; width: 100%; display: flex; flex-direction: column; gap: 1.1rem; }
  .lede { color: var(--text-dim); font-size: 0.85rem; line-height: 1.5; margin: 0; }
  /* Heading + lede on the left, the post control on the right of one row --
     the button used to float alone in a right-aligned bar with no context. */
  .page-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 1rem; flex-wrap: wrap;
  }
  .page-head .head-text { display: flex; flex-direction: column; gap: 0.3rem; }
  .page-head h2 { margin: 0; font-size: 1.1rem; font-weight: 800; letter-spacing: -0.01em; }
  .card {
    background: var(--card); border: 1px solid var(--hairline); border-radius: 6px;
    padding: 1.25rem; display: flex; flex-direction: column; gap: 0.9rem;
  }
  label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); display: flex; flex-direction: column; gap: 0.35rem; }
  input[type="text"], input[type="file"] {
    background: var(--paper); border: 1px solid var(--hairline-strong); color: var(--ink);
    border-radius: 3px; padding: 0.5rem; font-size: 0.9rem; font-family: inherit;
  }
  input:focus-visible { outline: 2px solid var(--bullion); outline-offset: 1px; }
  .btn-primary {
    background: var(--bullion); border: 1px solid var(--bullion-dim); color: #1a1200;
    border-radius: 4px; padding: 0.55rem 1rem; font-weight: 700; font-size: 0.85rem;
    cursor: pointer;
  }
  .btn-primary:hover { background: var(--bullion-dim); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-secondary {
    background: transparent; border: 1px solid var(--hairline-strong); color: var(--ink);
    border-radius: 4px; padding: 0.55rem 1rem; font-weight: 700; font-size: 0.85rem;
    cursor: pointer; font-family: inherit;
  }
  .btn-secondary:hover { border-color: var(--bullion); }
  .form-actions { display: flex; gap: 0.6rem; }
  .form-error { color: var(--alert); font-size: 0.8rem; display: none; }

  /* A masonry-style board (CSS columns, no JS) instead of one narrow
     single-file feed -- posted screenshots come in wildly different aspect
     ratios, and a plain grid would leave ragged gaps next to short cards.
     `columns: 320px` fills as many >=320px-wide columns as the wrap allows,
     so it actually uses the full width on a wide screen and collapses to
     one column on narrow ones. */
  .posts { columns: 320px; column-gap: 1rem; }
  .post {
    background: var(--card); border: 1px solid var(--hairline); border-radius: 6px;
    overflow: hidden; break-inside: avoid; margin-bottom: 1rem;
  }
  .post img {
    display: block; width: 100%; max-height: 480px; object-fit: contain;
    background: var(--paper); cursor: zoom-in;
  }
  .post-meta {
    padding: 0.7rem 0.9rem; display: flex; flex-direction: column; gap: 0.15rem;
    border-top: 1px solid var(--hairline);
  }
  .post-title { font-weight: 700; font-size: 0.95rem; }
  .post-sub { font-size: 0.75rem; color: var(--text-dim); display: flex; gap: 0.5rem; }
  .empty, .error { color: var(--text-dim); font-size: 0.85rem; padding: 0.5rem 0; }
  .error { color: var(--alert); }

  dialog { border: none; padding: 0; background: transparent; }
  dialog::backdrop { background: rgba(10, 11, 13, 0.72); }
  #post-dialog .card { width: min(90vw, 460px); }
  #lightbox { max-width: 96vw; max-height: 96vh; }
  #lightbox img {
    display: block; max-width: 96vw; max-height: 96vh; cursor: zoom-out;
    border-radius: 4px;
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <a href="/" class="brand-link" aria-label="Realm Arbitrage home">
    <svg class="seal" width="26" height="26" viewBox="0 0 30 30" aria-hidden="true">
      <circle cx="15" cy="15" r="13" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="15" cy="15" r="10" fill="none" stroke="currentColor" stroke-width="0.6"/>
      <g stroke="currentColor" stroke-width="0.9" stroke-linecap="round">
        <line x1="15" y1="1" x2="15" y2="3.4"/>
        <line x1="15" y1="26.6" x2="15" y2="29"/>
        <line x1="1" y1="15" x2="3.4" y2="15"/>
        <line x1="26.6" y1="15" x2="29" y2="15"/>
        <line x1="5.11" y1="5.11" x2="6.81" y2="6.81"/>
        <line x1="23.19" y1="23.19" x2="24.89" y2="24.89"/>
        <line x1="5.11" y1="24.89" x2="6.81" y2="23.19"/>
        <line x1="23.19" y1="6.81" x2="24.89" y2="5.11"/>
      </g>
      <path d="M9.5 15.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Realm Arbitrage</h1>
    </a>
  </div>
  <div class="nav">
    <button id="theme-toggle" title="Switch to dark mode" aria-label="Switch to dark mode">&#9789;</button>
    <a href="/snipes">Dashboard</a>
    <a href="/watchlist">Watchlist</a>
    <a href="/snipe-board" class="active">Snipe Board</a>
    <a href="/log">Log</a>
    <a href="/pricing" id="nav-pricing">Pricing</a>
    <a href="/profile" id="nav-profile" style="display:none;">Profile</a>
    <a href="/login" id="nav-login">Log in</a>
    <button id="nav-logout" style="display:none;">Log out</button>
  </div>
</div>
<div class="shell">
<div class="wrap">
  <div class="page-head">
    <div class="head-text">
      <h2>Snipe Board</h2>
      <p class="lede">Community feed of snipes.</p>
    </div>
    <div>
      <button class="btn-primary" id="open-post" style="display:none;">+ Post a snipe</button>
      <a class="btn-secondary" href="/login" id="login-to-post">Log in to post</a>
    </div>
  </div>

  <div class="posts" id="posts"></div>
  <div class="empty" id="empty" style="display:none;">No posts yet -- be the first.</div>
  <div class="error" id="load-error" style="display:none;"></div>
</div>
</div>

<dialog id="post-dialog">
  <div class="card">
    <label id="nickname-field" style="display:none;">Nickname
      <input type="text" id="post-nickname" maxlength="50" placeholder="e.g. Snipehunter">
    </label>
    <label>Title (optional)
      <input type="text" id="post-title" maxlength="200" placeholder="e.g. 4g Netherweave Bag on Draenor">
    </label>
    <label>Screenshot
      <input type="file" id="post-image" accept="image/png,image/jpeg,image/webp,image/gif" required>
    </label>
    <div class="form-error" id="post-error"></div>
    <div class="form-actions">
      <button class="btn-primary" id="post-submit">Post it</button>
      <button class="btn-secondary" id="post-cancel" type="button">Cancel</button>
    </div>
  </div>
</dialog>

<dialog id="lightbox">
  <img id="lightbox-img" src="" alt="">
</dialog>

<script>
const $ = (id) => document.getElementById(id);

function timeAgo(iso) {
  const diff = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (diff < 3600) return `${Math.round(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.round(diff / 3600)}h ago`;
  return `${Math.round(diff / 86400)}d ago`;
}

// Escapes quotes too (2026-07-31, real stored-XSS fix), not just the
// div.textContent->innerHTML trick's &/</> -- that trick only escapes what
// the browser escapes when serializing *text content*, but this function's
// output gets interpolated into a double-quoted alt="" attribute below, and
// a raw " in a post title broke out of the attribute and injected live
// markup (confirmed live: a title of `x" onload="alert(1)` executed on
// page load for every visitor, no login required to view the feed).
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

async function loadPosts() {
  $("load-error").style.display = "none";
  try {
    const r = await fetch("/api/forum/posts");
    if (!r.ok) throw new Error("request failed");
    const data = await r.json();
    $("empty").style.display = data.posts.length ? "none" : "block";
    $("posts").innerHTML = data.posts.map(p => `
      <div class="post">
        <img src="${p.image_url}" alt="${escapeHtml(p.title || "posted snipe")}" loading="lazy" data-full="${p.image_url}">
        <div class="post-meta">
          ${p.title ? `<div class="post-title">${escapeHtml(p.title)}</div>` : ""}
          <div class="post-sub">
            <span>${escapeHtml(p.author_nickname)}</span>
            <span>&middot;</span>
            <span>${timeAgo(p.created_at)}</span>
          </div>
        </div>
      </div>
    `).join("");
  } catch (e) {
    $("load-error").textContent = "Couldn't load posts.";
    $("load-error").style.display = "block";
  }
}

// Zoom: click any posted screenshot to open it full-size in a modal; click
// the image again (or press Escape, native <dialog> behavior) to close.
$("posts").addEventListener("click", (e) => {
  const img = e.target.closest("img[data-full]");
  if (!img) return;
  $("lightbox-img").src = img.dataset.full;
  $("lightbox").showModal();
});
$("lightbox").addEventListener("click", () => $("lightbox").close());

// Set on init() below from /api/me, and again the moment a nickname is
// saved -- lets the dialog decide whether to ask for one at all without a
// fresh /api/me round trip every time it opens.
let currentNickname = null;

function resetPostForm() {
  $("post-title").value = "";
  $("post-image").value = "";
  $("post-error").style.display = "none";
  const needsNickname = !currentNickname;
  $("nickname-field").style.display = needsNickname ? "flex" : "none";
  $("post-nickname").value = "";
  $("post-nickname").required = needsNickname;
}

$("open-post").addEventListener("click", () => {
  resetPostForm();
  $("post-dialog").showModal();
});
$("post-cancel").addEventListener("click", () => $("post-dialog").close());

$("post-submit").addEventListener("click", async () => {
  const title = $("post-title").value;
  const fileInput = $("post-image");
  const errEl = $("post-error");
  errEl.style.display = "none";
  if (!fileInput.files.length) {
    errEl.textContent = "Pick a screenshot first.";
    errEl.style.display = "block";
    return;
  }

  const btn = $("post-submit");
  btn.disabled = true;
  try {
    // A nickname is required before the first post ever lands (human
    // decision: posts used to show the account's real email publicly) --
    // enforced server-side too (see forum.create_post), this is just what
    // lets it happen in the same dialog instead of a separate settings trip.
    if (!currentNickname) {
      const nickname = $("post-nickname").value.trim();
      if (!nickname) {
        errEl.textContent = "Pick a nickname first -- it's shown on your posts instead of your email.";
        errEl.style.display = "block";
        return;
      }
      const nickR = await fetch("/api/me/nickname", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname }),
      });
      if (!nickR.ok) {
        const err = await nickR.json().catch(() => ({}));
        throw new Error(err.detail || "Couldn't save that nickname.");
      }
      currentNickname = (await nickR.json()).nickname;
    }

    const body = new FormData();
    if (title) body.append("title", title);
    body.append("image", fileInput.files[0]);
    const r = await fetch("/api/forum/posts", { method: "POST", body });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.detail || "Couldn't post that.");
    }
    $("post-dialog").close();
    await loadPosts();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = "block";
  } finally {
    btn.disabled = false;
  }
});

(async function init() {
  const me = await fetch("/api/me").catch(() => null);
  if (me && me.ok) {
    const meData = await me.json();
    currentNickname = meData.nickname || null;
    $("open-post").style.display = "inline-block";
    $("login-to-post").style.display = "none";
    // This page is public, so the default markup is the logged-out nav.
    // Logged in, swap to the authenticated in-app nav dashboard.html uses:
    // Pricing dropped, Profile + Log out added.
    $("nav-login").remove();
    $("nav-pricing").remove();
    $("nav-profile").style.display = "inline-block";
    $("nav-logout").style.display = "inline-block";
  }
  await loadPosts();
})();

// Same endpoint/redirect as dashboard.html's #logout button. No snipe-cache
// clearing here -- this page never writes one.
$("nav-logout").addEventListener("click", async () => {
  await fetch("/auth/logout", { method: "POST" }).catch(() => {});
  window.location.href = "/login";
});

function applyThemeButtonState() {
  const dark = document.documentElement.dataset.theme === "dark";
  const btn = $("theme-toggle");
  btn.textContent = dark ? "☀" : "☽";
  const label = dark ? "Switch to light mode" : "Switch to dark mode";
  btn.title = label;
  btn.setAttribute("aria-label", label);
}
$("theme-toggle").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("theme", next);
  applyThemeButtonState();
});
applyThemeButtonState();
</script>
</body>
</html>
