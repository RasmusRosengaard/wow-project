<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile — Realm Arbitrage</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script>
  (function () {
    var saved = localStorage.getItem("theme");
    var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --paper: #f6f7f5;
    --card: #ffffff;
    --hairline: #d8dbd4;
    --hairline-strong: #c3c8bd;
    --ink: #14161a;
    --text-dim: #5b6259;
    --bullion: #a67c2e;
    --bullion-dim: #8a6624;
    --verified: #2f7d72;
    --verified-bg: rgba(47,125,114,0.08);
    --alert: #b0392f;
    --alert-bg: rgba(176,57,47,0.08);
    --pending-bg: rgba(166,124,46,0.1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #14161a;
    --card: #1b1e24;
    --hairline: #333844;
    --hairline-strong: #454b59;
    --ink: #e8eaed;
    --text-dim: #8b93a3;
    --bullion: #d4af61;
    --bullion-dim: #b8934f;
    --verified: #3fa9a0;
    --verified-bg: rgba(63,169,160,0.14);
    --alert: #e0645a;
    --alert-bg: rgba(224,100,90,0.14);
    --pending-bg: rgba(212,175,97,0.14);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: var(--paper); color: var(--ink); min-height: 100vh;
  }
  code, .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; padding: 1rem 1.5rem; background: var(--card);
    border-bottom: 1px solid var(--hairline-strong);
  }
  .brand { display: flex; align-items: center; gap: 0.6rem; }
  .brand-link { display: contents; text-decoration: none; color: inherit; }
  .brand h1 {
    font-size: 1.05rem; margin: 0; font-weight: 800; letter-spacing: -0.01em;
    text-transform: uppercase; color: var(--ink);
  }
  .seal { color: var(--verified); flex-shrink: 0; }
  .nav { display: flex; gap: 0.4rem; align-items: center; }
  .nav a, .nav button {
    background: transparent; border: 1px solid transparent; color: var(--text-dim);
    border-radius: 4px; padding: 0.45rem 0.8rem; cursor: pointer; font-size: 0.8rem;
    text-decoration: none; font-weight: 600; font-family: inherit;
    text-transform: none; display: inline;
    transition: background-color 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .nav a:hover, .nav button:hover { background: var(--paper); border-color: var(--hairline-strong); color: var(--ink); }
  /* The current page's own nav link -- shown, not omitted, so the nav's set
     of items (and therefore its width/layout) never changes page to page --
     an omitted self-link used to make the whole bar visibly shift depending
     on which page you were on (2026-07-30 human report). */
  .nav a.active { color: var(--bullion); font-weight: 700; cursor: default; }
  .nav a.active:hover { background: transparent; border-color: transparent; }
  #theme-toggle { font-size: 1rem; line-height: 1; padding: 0.45rem 0.6rem; }

  .shell { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; padding: 2.5rem 1.5rem; }
  .card {
    background: var(--card); border: 1px solid var(--hairline); border-radius: 6px;
    padding: 2rem; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 1.1rem;
  }
  h2 {
    font-size: 1rem; margin: 0; font-weight: 800;
    text-transform: uppercase; letter-spacing: -0.01em;
  }
  .row { display: flex; justify-content: space-between; align-items: center; font-size: 0.88rem; gap: 1rem; padding-bottom: 0.9rem; border-bottom: 1px solid var(--hairline); }
  .row .lbl { color: var(--text-dim); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .row span:not(.lbl) { font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace; }
  .badge {
    display: inline-block; padding: 0.2rem 0.6rem; border-radius: 3px;
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .badge.active { background: var(--verified-bg); color: var(--verified); border: 1px solid var(--verified); }
  .badge.inactive { background: var(--alert-bg); color: var(--alert); border: 1px solid var(--alert); }
  .badge.pending { background: var(--pending-bg); color: var(--bullion); border: 1px solid var(--bullion); }
  button, a.btn {
    background: var(--bullion); border: 1px solid var(--bullion); color: #fff;
    border-radius: 3px; padding: 0.6rem; cursor: pointer; font-size: 0.85rem;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    text-align: center; text-decoration: none; display: block; font-family: inherit;
  }
  button:hover, a.btn:hover { background: var(--bullion-dim); border-color: var(--bullion-dim); }
  button:disabled { opacity: 0.6; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--bullion); outline-offset: 1px; }
  .error { color: var(--alert); font-size: 0.8rem; min-height: 1em; }
  .contact { font-size: 0.75rem; color: var(--text-dim); text-align: center; margin-top: 0.9rem; }
  .contact a { color: var(--bullion); }

  /* WoW Accounts (2026-08-02, human request) -- register real WoW accounts
     + which EU realms have a character on them, so dashboard.html can show
     which account to log into for a given snipe. Genuinely new UI for this
     codebase (no existing repeatable add/remove-row pattern to mirror) --
     kept as plain nested flex blocks rather than a <dialog>, matching this
     page's existing inline-edit convention (#nickname/#nickname-save)
     rather than snipeboard.html's modal-form convention, since this is a
     settings page, not a one-off action. */
  #wow-accounts-list { display: flex; flex-direction: column; gap: 1rem; }
  .wow-account { border-bottom: 1px solid var(--hairline); padding-bottom: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
  .wow-account:last-child { border-bottom: none; padding-bottom: 0; }
  .wow-account-head { display: flex; gap: 0.5rem; }
  .wow-account-head input {
    flex: 1; background: var(--paper); border: 1px solid var(--hairline-strong); color: var(--ink);
    border-radius: 3px; padding: 0.5rem; font-size: 0.85rem; font-family: inherit;
  }
  .wow-account-head button { width: auto; padding: 0.5rem 0.75rem; }
  .wow-account-head button.danger { background: transparent; border-color: var(--alert); color: var(--alert); }
  .wow-account-head button.danger:hover { background: var(--alert-bg); border-color: var(--alert); }
  .realm-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .realm-chip {
    display: inline-flex; align-items: center; gap: 0.35rem; background: var(--paper);
    border: 1px solid var(--hairline-strong); border-radius: 3px; padding: 0.25rem 0.5rem; font-size: 0.78rem;
  }
  .realm-chip button {
    width: auto; padding: 0; background: transparent; border: none; color: var(--text-dim);
    font-weight: 700; line-height: 1; display: inline;
  }
  .realm-chip button:hover { color: var(--alert); background: transparent; }
  .add-realm-row { display: flex; gap: 0.5rem; }
  .add-realm-row select {
    flex: 1; background: var(--paper); border: 1px solid var(--hairline-strong); color: var(--ink);
    border-radius: 3px; padding: 0.5rem; font-size: 0.85rem; font-family: inherit;
  }
  .add-realm-row button { width: auto; padding: 0.5rem 0.75rem; }
  .cap-note { font-size: 0.72rem; color: var(--text-dim); }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <a href="/" class="brand-link" aria-label="Realm Arbitrage home">
    <svg class="seal" width="26" height="26" viewBox="0 0 30 30" aria-hidden="true">
      <circle cx="15" cy="15" r="13" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="15" cy="15" r="10" fill="none" stroke="currentColor" stroke-width="0.6"/>
      <g stroke="currentColor" stroke-width="0.9" stroke-linecap="round">

        <line x1="1" y1="15" x2="3.4" y2="15"/>
        <line x1="26.6" y1="15" x2="29" y2="15"/>
        <line x1="5.11" y1="5.11" x2="6.81" y2="6.81"/>
        <line x1="23.19" y1="23.19" x2="24.89" y2="24.89"/>
        <line x1="5.11" y1="24.89" x2="6.81" y2="23.19"/>
        <line x1="23.19" y1="6.81" x2="24.89" y2="5.11"/>
      </g>
      <path d="M9.5 15.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    </a>

  <div class="nav">
    <button id="theme-toggle" title="Switch to dark mode" aria-label="Switch to dark mode">&#9789;</button>
    <a href="/snipes">Dashboard</a>
    <a href="/watchlist">Watchlist</a>
    <a href="/snipe-board">Snipe Board</a>
    <a href="/profile" class="active">Profile</a>
    <button id="nav-logout">Log out</button>
  </div>
</div>
<div class="shell">
  <div class="card">
    <h2>Profile</h2>
    <div class="row"><span class="lbl">Email</span><span id="email">…</span></div>
    <div class="row"><span class="lbl">Subscription</span><span id="status-badge">…</span></div>
    <div class="row" id="period-row" style="display:none;">
      <span class="lbl">Renews / ends</span><span id="period-end"></span>
    </div>
    <div class="row" style="border-bottom:none; flex-direction:column; align-items:stretch; gap:0.5rem;">
      <span class="lbl">Nickname</span>
      <div style="display:flex; gap:0.5rem;">
        <input type="text" id="nickname" maxlength="50" placeholder="e.g. Snipehunter"
               style="flex:1; background:var(--paper); border:1px solid var(--hairline-strong); color:var(--ink); border-radius:3px; padding:0.5rem; font-size:0.85rem; font-family:inherit;">
        <button id="nickname-save" style="width:auto; padding:0.5rem 0.9rem;">Save</button>
      </div>
    </div>
    <div id="nickname-error" class="error"></div>
    <div id="error" class="error"></div>
    <div id="actions"></div>
  </div>
  <div class="card" id="wow-accounts-card" style="max-width:640px;">
    <h2>WoW Accounts</h2>
    <div id="wow-accounts-upsell" class="cap-note" style="display:none;"></div>
    <div id="wow-accounts-list"></div>
    <div class="row" id="add-account-row" style="border-bottom:none; flex-direction:column; align-items:stretch; gap:0.5rem;">
      <span class="lbl">Add a WoW account</span>
      <div style="display:flex; gap:0.5rem;">
        <input type="text" id="new-account-label" maxlength="50" placeholder="e.g. Main"
               style="flex:1; background:var(--paper); border:1px solid var(--hairline-strong); color:var(--ink); border-radius:3px; padding:0.5rem; font-size:0.85rem; font-family:inherit;">
        <button id="add-account-btn" style="width:auto; padding:0.5rem 0.9rem;">Add account</button>
      </div>
    </div>
    <div id="add-account-cap-note" class="cap-note" style="display:none;">Maximum 10 WoW accounts reached.</div>
    <div id="wow-accounts-error" class="error"></div>
  </div>
</div>
<div class="contact">
  Issues with the site or payment? Email
  <a href="mailto:rasmus2001@gmail.com">rasmus2001@gmail.com</a> or find
  <b>rasmus5533</b> on Discord.

<script>
const $ = (id) => document.getElementById(id);

// Regex-based escaper, correct in any interpolation context (attribute or
// text) -- not the div.textContent->innerHTML trick, which only escapes
// what a browser escapes when serializing text nodes (&/</>) and not
// quotes. This project shipped a real stored-XSS bug from that shortcut
// once already (snipeboard.html, see HISTORY.md) -- realm/account-label
// strings below are either Blizzard API data or free-text user input, so
// this page needs the same real escaper dashboard.html/snipeboard.html use.
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

let realmNameById = new Map();
let currentAccounts = [];

function badge(status, isSuperuser) {
  if (isSuperuser) return `<span class="badge active">Admin access</span>`;
  if (status === "active") return `<span class="badge active">Active</span>`;
  if (status === "past_due") return `<span class="badge pending">Past due</span>`;
  if (!status) return `<span class="badge inactive">No subscription</span>`;
  return `<span class="badge inactive">${status}</span>`;
}

async function startPortal() {
  const err = $("error");
  err.textContent = "";
  const r = await fetch("/billing/portal", { method: "POST" });
  if (r.status === 401) { window.location.href = "/login"; return; }
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    err.textContent = body.detail || "Couldn't open the billing portal -- try again.";
    return;
  }
  const data = await r.json();
  window.location.href = data.url;
}

async function saveNickname() {
  const err = $("nickname-error");
  err.textContent = "";
  const nickname = $("nickname").value.trim();
  if (!nickname) {
    err.textContent = "Nickname can't be empty.";
    return;
  }
  const r = await fetch("/api/me/nickname", {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nickname }),
  });
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    err.textContent = body.detail || "Couldn't save that nickname.";
    return;
  }
  const data = await r.json();
  $("nickname").value = data.nickname;
}

async function loadEuRealms() {
  try {
    const r = await fetch("/api/realms/eu");
    if (!r.ok) return; // not subscribed (402) -- leave the Map empty
    const data = await r.json();
    realmNameById = new Map((data.realms || []).map(realm => [realm.id, realm.name]));
  } catch (e) { /* leave empty */ }
}

async function loadWowAccounts() {
  try {
    const r = await fetch("/api/wow-accounts");
    if (!r.ok) return [];
    const data = await r.json();
    return data.accounts || [];
  } catch (e) { return []; }
}

// Sorts by realm name, not by the html string (id-prefixed values would
// otherwise sort lexicographically ahead of the name text).
function realmOptionsHtml(excludeIds) {
  const entries = [...realmNameById.entries()]
    .filter(([id]) => !excludeIds.has(id))
    .sort((a, b) => a[1].localeCompare(b[1]));
  return entries.map(([id, name]) => `<option value="${id}">${escapeHtml(name)}</option>`).join("");
}

async function refreshWowAccounts() {
  currentAccounts = await loadWowAccounts();
  renderWowAccounts();
}

function renderWowAccounts() {
  const list = $("wow-accounts-list");
  if (!currentAccounts.length) {
    list.innerHTML = `<div class="cap-note">No WoW accounts registered yet.</div>`;
  } else {
    list.innerHTML = currentAccounts.map(acct => {
      const excludeIds = new Set(acct.realms);
      const chips = acct.realms.map(id => {
        const name = realmNameById.get(id) || String(id);
        return `<span class="realm-chip">${escapeHtml(name)}<button data-remove-realm="${id}" data-account="${acct.id}" title="Remove">&times;</button></span>`;
      }).join("") || `<span class="cap-note">No realms added yet.</span>`;
      const atRealmCap = acct.realms.length >= 50;
      const addRealmRow = atRealmCap
        ? `<div class="cap-note">Maximum 50 realms reached.</div>`
        : `<div class="add-realm-row">
             <select data-account-select="${acct.id}"><option value="">Add a realm…</option>${realmOptionsHtml(excludeIds)}</select>
             <button data-add-realm="${acct.id}">Add realm</button>
           </div>`;
      return `
        <div class="wow-account" data-account-id="${acct.id}">
          <div class="wow-account-head">
            <input type="text" value="${escapeHtml(acct.label)}" maxlength="50" data-rename-input="${acct.id}">
            <button data-rename="${acct.id}">Save</button>
            <button class="danger" data-delete="${acct.id}">Delete</button>
          </div>
          <div class="realm-chips">${chips}</div>
          ${addRealmRow}
        </div>`;
    }).join("");
  }

  list.querySelectorAll("[data-rename]").forEach(btn => {
    btn.addEventListener("click", () => renameAccount(Number(btn.dataset.rename)));
  });
  list.querySelectorAll("[data-delete]").forEach(btn => {
    btn.addEventListener("click", () => deleteAccount(Number(btn.dataset.delete)));
  });
  list.querySelectorAll("[data-add-realm]").forEach(btn => {
    btn.addEventListener("click", () => addRealm(Number(btn.dataset.addRealm)));
  });
  list.querySelectorAll("[data-remove-realm]").forEach(btn => {
    btn.addEventListener("click", () => removeRealm(Number(btn.dataset.account), Number(btn.dataset.removeRealm)));
  });

  const atAccountCap = currentAccounts.length >= 10;
  $("add-account-btn").disabled = atAccountCap;
  $("new-account-label").disabled = atAccountCap;
  $("add-account-cap-note").style.display = atAccountCap ? "block" : "none";
}

async function addAccount() {
  const err = $("wow-accounts-error");
  err.textContent = "";
  const input = $("new-account-label");
  const label = input.value.trim();
  if (!label) { err.textContent = "Account label can't be empty."; return; }
  const r = await fetch("/api/wow-accounts", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ label }),
  });
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    err.textContent = body.detail || "Couldn't add that account.";
    return;
  }
  input.value = "";
  await refreshWowAccounts();
}

async function renameAccount(accountId) {
  const err = $("wow-accounts-error");
  err.textContent = "";
  const input = document.querySelector(`[data-rename-input="${accountId}"]`);
  const label = input.value.trim();
  if (!label) { err.textContent = "Account label can't be empty."; return; }
  const r = await fetch(`/api/wow-accounts/${accountId}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ label }),
  });
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    err.textContent = body.detail || "Couldn't rename that account.";
    return;
  }
  await refreshWowAccounts();
}

async function deleteAccount(accountId) {
  const err = $("wow-accounts-error");
  err.textContent = "";
  const r = await fetch(`/api/wow-accounts/${accountId}`, { method: "DELETE" });
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    err.textContent = body.detail || "Couldn't delete that account.";
    return;
  }
  await refreshWowAccounts();
}

async function addRealm(accountId) {
  const err = $("wow-accounts-error");
  err.textContent = "";
  const select = document.querySelector(`[data-account-select="${accountId}"]`);
  const realmId = Number(select.value);
  if (!realmId) { err.textContent = "Pick a realm first."; return; }
  const r = await fetch(`/api/wow-accounts/${accountId}/realms`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ connected_realm_id: realmId }),
  });
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    err.textContent = body.detail || "Couldn't add that realm.";
    return;
  }
  await refreshWowAccounts();
}

async function removeRealm(accountId, realmId) {
  const err = $("wow-accounts-error");
  err.textContent = "";
  const r = await fetch(`/api/wow-accounts/${accountId}/realms/${realmId}`, { method: "DELETE" });
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    err.textContent = body.detail || "Couldn't remove that realm.";
    return;
  }
  await refreshWowAccounts();
}

(async function init() {
  const me = await fetch("/api/me").catch(() => null);
  if (!me || !me.ok) { window.location.href = "/login"; return; }
  const data = await me.json();

  $("email").textContent = data.email;
  $("nickname").value = data.nickname || "";
  $("nickname-save").addEventListener("click", saveNickname);
  $("status-badge").innerHTML = badge(data.subscription_status, data.is_superuser);

  if (data.subscription_current_period_end && !data.is_superuser) {
    $("period-row").style.display = "flex";
    $("period-end").textContent = new Date(data.subscription_current_period_end).toLocaleDateString();
  }

  const actions = $("actions");
  if (data.is_superuser) {
    actions.innerHTML = "";
  } else if (data.subscription_status === "active" || data.has_stripe_customer) {
    actions.innerHTML = `<button id="manage">Manage subscription (cancel, payment method, invoices)</button>`;
    $("manage").addEventListener("click", startPortal);
  } else {
    actions.innerHTML = `<a class="btn" href="/subscribe">Subscribe</a>`;
  }

  // WoW Accounts card -- gated client-side (mirrors the actions div logic
  // just above) since the server 402s anyway; no reason to show controls
  // that will always fail for a non-subscribed account.
  $("add-account-btn").addEventListener("click", addAccount);
  const subscribed = data.subscription_status === "active" || data.is_superuser;
  if (subscribed) {
    await loadEuRealms();
    await refreshWowAccounts();
  } else {
    $("wow-accounts-upsell").style.display = "block";
    $("wow-accounts-upsell").innerHTML = `Subscribe to register WoW accounts and realms. <a href="/subscribe">See plans &rarr;</a>`;
    $("wow-accounts-list").style.display = "none";
    $("add-account-row").style.display = "none";
  }
})();

// Same endpoint/redirect as dashboard.html's #logout button -- this page had
// no way to log out at all before (2026-07-30 human report).
$("nav-logout").addEventListener("click", async () => {
  await fetch("/auth/logout", { method: "POST" }).catch(() => {});
  window.location.href = "/login";
});

function applyThemeButtonState() {
  const dark = document.documentElement.dataset.theme === "dark";
  const btn = $("theme-toggle");
  btn.textContent = dark ? "☀" : "☽";
  const label = dark ? "Switch to light mode" : "Switch to dark mode";
  btn.title = label;
  btn.setAttribute("aria-label", label);
}
$("theme-toggle").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("theme", next);
  applyThemeButtonState();
});
applyThemeButtonState();
</script>
</body>
</html>
