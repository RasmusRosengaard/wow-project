<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile — AH Snipe Dashboard</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14170f; --panel: #1b1f15; --panel-raised: #23281a;
    --border: #3a4029; --border-bright: #565f38;
    --text: #eef0e6; --text-dim: #97a084;
    --toxic: #a6e600; --toxic-dim: #7fb300; --brass: #c9963e; --ember: #ff7a45; --gold: #ffd651;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    background-image: radial-gradient(ellipse at top, rgba(166,230,0,0.05), transparent 60%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 1rem;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 2rem; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 1.1rem;
  }
  h1 {
    font-size: 1.15rem; margin: 0; font-weight: 800;
    text-transform: uppercase; letter-spacing: -0.01em;
  }
  .row { display: flex; justify-content: space-between; align-items: center; font-size: 0.88rem; gap: 1rem; }
  .row .lbl { color: var(--text-dim); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .row span:not(.lbl) { font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace; }
  .badge {
    display: inline-block; padding: 0.2rem 0.6rem; border-radius: 3px;
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .badge.active { background: rgba(166,230,0,0.15); color: var(--toxic); border: 1px solid var(--toxic-dim); }
  .badge.inactive { background: rgba(255,122,69,0.12); color: var(--ember); border: 1px solid var(--ember); }
  .badge.pending { background: rgba(255,214,81,0.12); color: var(--gold); border: 1px solid var(--gold); }
  button, a.btn {
    background: var(--toxic); border: 1px solid var(--toxic); color: #0f1400;
    border-radius: 3px; padding: 0.6rem; cursor: pointer; font-size: 0.85rem;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    text-align: center; text-decoration: none; display: block;
  }
  button:hover, a.btn:hover { background: var(--toxic-dim); border-color: var(--toxic-dim); }
  button:disabled { opacity: 0.6; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--toxic); outline-offset: 1px; }
  a.secondary { background: var(--panel-raised); border: 1px solid var(--border-bright); color: var(--text); }
  a.secondary:hover { background: var(--border); }
  .error { color: var(--ember); font-size: 0.8rem; min-height: 1em; }
  .nav { font-size: 0.8rem; color: var(--text-dim); }
  .nav a { color: var(--brass); }
</style>
</head>
<body>
<div class="card">
  <h1>Profile</h1>
  <div class="row"><span class="lbl">Email</span><span id="email">…</span></div>
  <div class="row"><span class="lbl">Subscription</span><span id="status-badge">…</span></div>
  <div class="row" id="period-row" style="display:none;">
    <span class="lbl">Renews / ends</span><span id="period-end"></span>
  </div>
  <div id="error" class="error"></div>
  <div id="actions"></div>
  <div class="nav"><a href="/">&larr; Back to dashboard</a></div>
</div>
<script>
const $ = (id) => document.getElementById(id);

function badge(status, isSuperuser) {
  if (isSuperuser) return `<span class="badge active">Admin access</span>`;
  if (status === "active") return `<span class="badge active">Active</span>`;
  if (status === "past_due") return `<span class="badge pending">Past due</span>`;
  if (!status) return `<span class="badge inactive">No subscription</span>`;
  return `<span class="badge inactive">${status}</span>`;
}

async function startPortal() {
  const err = $("error");
  err.textContent = "";
  const r = await fetch("/billing/portal", { method: "POST" });
  if (r.status === 401) { window.location.href = "/login"; return; }
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    err.textContent = body.detail || "Couldn't open the billing portal -- try again.";
    return;
  }
  const data = await r.json();
  window.location.href = data.url;
}

(async function init() {
  const me = await fetch("/api/me").catch(() => null);
  if (!me || !me.ok) { window.location.href = "/login"; return; }
  const data = await me.json();

  $("email").textContent = data.email;
  $("status-badge").innerHTML = badge(data.subscription_status, data.is_superuser);

  if (data.subscription_current_period_end && !data.is_superuser) {
    $("period-row").style.display = "flex";
    $("period-end").textContent = new Date(data.subscription_current_period_end).toLocaleDateString();
  }

  const actions = $("actions");
  if (data.is_superuser) {
    actions.innerHTML = "";
  } else if (data.subscription_status === "active" || data.has_stripe_customer) {
    actions.innerHTML = `<button id="manage">Manage subscription (cancel, payment method, invoices)</button>`;
    $("manage").addEventListener("click", startPortal);
  } else {
    actions.innerHTML = `<a class="btn" href="/subscribe">Subscribe</a>`;
  }
})();
</script>
</body>
</html>
