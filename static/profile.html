<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile — Realm Arbitrage</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script>
  (function () {
    var saved = localStorage.getItem("theme");
    var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --paper: #f6f7f5;
    --card: #ffffff;
    --hairline: #d8dbd4;
    --hairline-strong: #c3c8bd;
    --ink: #14161a;
    --text-dim: #5b6259;
    --bullion: #a67c2e;
    --bullion-dim: #8a6624;
    --verified: #2f7d72;
    --verified-bg: rgba(47,125,114,0.08);
    --alert: #b0392f;
    --alert-bg: rgba(176,57,47,0.08);
    --pending-bg: rgba(166,124,46,0.1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #14161a;
    --card: #1b1e24;
    --hairline: #333844;
    --hairline-strong: #454b59;
    --ink: #e8eaed;
    --text-dim: #8b93a3;
    --bullion: #d4af61;
    --bullion-dim: #b8934f;
    --verified: #3fa9a0;
    --verified-bg: rgba(63,169,160,0.14);
    --alert: #e0645a;
    --alert-bg: rgba(224,100,90,0.14);
    --pending-bg: rgba(212,175,97,0.14);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: var(--paper); color: var(--ink); min-height: 100vh;
  }
  code, .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; padding: 1rem 1.5rem; background: var(--card);
    border-bottom: 1px solid var(--hairline-strong);
  }
  .brand { display: flex; align-items: center; gap: 0.6rem; }
  .brand-link { display: contents; text-decoration: none; color: inherit; }
  .brand h1 {
    font-size: 1.05rem; margin: 0; font-weight: 800; letter-spacing: -0.01em;
    text-transform: uppercase; color: var(--ink);
  }
  .seal { color: var(--verified); flex-shrink: 0; }
  .nav { display: flex; gap: 0.4rem; align-items: center; }
  .nav a, .nav button {
    background: transparent; border: 1px solid transparent; color: var(--text-dim);
    border-radius: 4px; padding: 0.45rem 0.8rem; cursor: pointer; font-size: 0.8rem;
    text-decoration: none; font-weight: 600; font-family: inherit;
    text-transform: none; display: inline;
    transition: background-color 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .nav a:hover, .nav button:hover { background: var(--paper); border-color: var(--hairline-strong); color: var(--ink); }
  .nav a.active { color: var(--bullion); font-weight: 700; cursor: default; }
  .nav a.active:hover { background: transparent; border-color: transparent; }
  #theme-toggle { font-size: 1rem; line-height: 1; padding: 0.45rem 0.6rem; }

  /* Wider than the old single-narrow-column layout (2026-08-02, human
     request: "remake the entire profile page") -- WoW Accounts needs room
     for a card grid, not a 420px column. */
  .shell { display: flex; flex-direction: column; gap: 1.75rem; max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem 3rem; }

  h2 {
    font-size: 1rem; margin: 0; font-weight: 800;
    text-transform: uppercase; letter-spacing: -0.01em;
  }
  button, a.btn {
    background: var(--bullion); border: 1px solid var(--bullion); color: #fff;
    border-radius: 3px; padding: 0.6rem 1rem; cursor: pointer; font-size: 0.85rem;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    text-align: center; text-decoration: none; display: inline-block; font-family: inherit;
  }
  button:hover, a.btn:hover { background: var(--bullion-dim); border-color: var(--bullion-dim); }
  button:disabled { opacity: 0.6; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--bullion); outline-offset: 1px; }
  .error { color: var(--alert); font-size: 0.8rem; min-height: 1em; }
  .cap-note { font-size: 0.76rem; color: var(--text-dim); }
  .contact { font-size: 0.75rem; color: var(--text-dim); text-align: center; margin-top: 0.5rem; }
  .contact a { color: var(--bullion); }

  /* --- Account summary card: compact, horizontal, not a stacked list of
     labeled rows -- the old layout put email/subscription/nickname each on
     their own full-width row, which read as a form more than a summary. --- */
  .account-card {
    background: var(--card); border: 1px solid var(--hairline); border-radius: 6px;
    padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 1rem;
  }
  .account-summary-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; }
  .account-identity { display: flex; flex-wrap: wrap; align-items: center; gap: 0.7rem; }
  .account-email { font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace; font-size: 0.92rem; }
  .badge {
    display: inline-block; padding: 0.2rem 0.6rem; border-radius: 3px;
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .badge.active { background: var(--verified-bg); color: var(--verified); border: 1px solid var(--verified); }
  .badge.inactive { background: var(--alert-bg); color: var(--alert); border: 1px solid var(--alert); }
  .badge.pending { background: var(--pending-bg); color: var(--bullion); border: 1px solid var(--bullion); }
  .period-note { font-size: 0.76rem; color: var(--text-dim); }
  .nickname-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; padding-top: 0.9rem; border-top: 1px solid var(--hairline); }
  .nickname-row label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); white-space: nowrap; }
  .nickname-row input {
    flex: 1; min-width: 160px; background: var(--paper); border: 1px solid var(--hairline-strong); color: var(--ink);
    border-radius: 3px; padding: 0.5rem 0.6rem; font-size: 0.85rem; font-family: inherit;
  }
  .nickname-row button { width: auto; padding: 0.5rem 0.9rem; }

  /* --- WoW Accounts section --- */
  .section-head { display: flex; flex-direction: column; gap: 0.3rem; }
  .section-lede { margin: 0; font-size: 0.85rem; color: var(--text-dim); max-width: 62ch; }
  .upsell { font-size: 0.88rem; color: var(--text-dim); }
  .upsell a { color: var(--bullion); font-weight: 700; text-decoration: none; }
  .upsell a:hover { text-decoration: underline; }

  @keyframes skeleton-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.75; } }
  .wow-accounts-loading, .wow-accounts-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem;
  }
  .skeleton-card { height: 150px; border-radius: 6px; background: var(--hairline); animation: skeleton-pulse 1.3s ease-in-out infinite; }

  .wow-account-card {
    background: var(--card); border: 1px solid var(--hairline-strong); border-radius: 6px;
    padding: 1rem; display: flex; flex-direction: column; gap: 0.7rem;
  }
  .wow-account-card-name-row input {
    width: 100%; background: var(--paper); border: 1px solid var(--hairline-strong); color: var(--ink);
    border-radius: 3px; padding: 0.5rem 0.6rem; font-size: 0.9rem; font-weight: 700; font-family: inherit;
  }
  .wow-account-card-actions-row { display: flex; gap: 0.5rem; }
  .wow-account-card-actions-row button {
    flex: 1; width: auto; padding: 0.4rem 0.5rem; font-size: 0.7rem;
  }
  .wow-account-card-actions-row button.danger {
    background: transparent; border-color: var(--alert); color: var(--alert);
  }
  .wow-account-card-actions-row button.danger:hover { background: var(--alert-bg); border-color: var(--alert); }

  /* Realm chips: full names always shown, deliberately no truncation
     anywhere in this section (2026-08-02, human request) -- chips wrap
     within the row and grow in height rather than clipping text. */
  .realm-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .realm-chip {
    display: inline-flex; align-items: center; gap: 0.35rem; background: var(--paper);
    border: 1px solid var(--hairline-strong); border-radius: 3px; padding: 0.3rem 0.55rem;
    font-size: 0.78rem; white-space: normal; word-break: break-word;
  }
  .realm-chip button {
    width: auto; padding: 0; background: transparent; border: none; color: var(--text-dim);
    font-weight: 700; line-height: 1; display: inline; font-size: 0.9rem;
  }
  .realm-chip button:hover { color: var(--alert); background: transparent; }

  .realm-search-wrap { position: relative; }
  .realm-search-wrap input {
    width: 100%; background: var(--paper); border: 1px solid var(--hairline-strong); color: var(--ink);
    border-radius: 3px; padding: 0.5rem 0.6rem; font-size: 0.82rem; font-family: inherit;
  }
  .realm-search-results {
    display: none; position: absolute; top: 100%; left: 0; right: 0; margin-top: 3px; z-index: 30;
    background: var(--card); border: 1px solid var(--hairline-strong); border-radius: 4px;
    max-height: 220px; overflow-y: auto; box-shadow: 0 6px 16px rgba(0,0,0,0.18);
  }
  .realm-search-item { padding: 0.5rem 0.65rem; font-size: 0.82rem; cursor: pointer; white-space: normal; }
  .realm-search-item:hover { background: var(--paper); }
  .realm-search-empty { padding: 0.5rem 0.65rem; font-size: 0.78rem; color: var(--text-dim); }

  .wow-account-add-card {
    border: 1px dashed var(--hairline-strong); border-radius: 6px; padding: 1rem;
    display: flex; align-items: center; justify-content: center; min-height: 120px;
    color: var(--text-dim); font-weight: 700; font-size: 0.85rem; text-transform: uppercase;
    letter-spacing: 0.03em; background: transparent; cursor: pointer; width: 100%;
  }
  .wow-account-add-card:hover { border-color: var(--bullion); color: var(--bullion); background: transparent; }
  .wow-account-add-card--disabled { cursor: default; text-transform: none; letter-spacing: normal; font-weight: 600; }
  .wow-account-add-card--disabled:hover { border-color: var(--hairline-strong); color: var(--text-dim); }
</style>

<script>
const $ = (id) => document.getElementById(id);

// Regex-based escaper, correct in any interpolation context (attribute or
// text) -- not the div.textContent->innerHTML trick, which only escapes
// what a browser escapes when serializing text nodes (&/</>) and not
// quotes. This project shipped a real stored-XSS bug from that shortcut
// once already (snipeboard.html, see HISTORY.md) -- realm/account-label
// strings below are either Blizzard API data or free-text user input, so
// this page needs the same real escaper dashboard.html/snipeboard.html use.
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

// Flat [{id, name}, ...] -- one entry per *member realm name* of a
// connected realm, not one per connected-realm id (a connected realm can
// bundle several named realms sharing one AH -- see api_realms_eu()'s
// docstring in dashboard.py). Used for search, so a user can find their
// realm by any of its names. realmNameById below dedupes this back down
// to one (the first/primary) name per id, purely for chip display.
let realmSearchEntries = [];
let realmNameById = new Map();
let currentAccounts = [];

function badge(status, isSuperuser) {
  if (isSuperuser) return `<span class="badge active">Admin access</span>`;
  if (status === "active") return `<span class="badge active">Active</span>`;
  if (status === "past_due") return `<span class="badge pending">Past due</span>`;
  if (!status) return `<span class="badge inactive">No subscription</span>`;
  return `<span class="badge inactive">${status}</span>`;
}

async function startPortal() {
  const err = $("error");
  err.textContent = "";
  const r = await fetch("/billing/portal", { method: "POST" });
  if (r.status === 401) { window.location.href = "/login"; return; }
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    err.textContent = body.detail || "Couldn't open the billing portal -- try again.";
    return;
  }
  const data = await r.json();
  window.location.href = data.url;
}

async function saveNickname() {
  const err = $("nickname-error");
  err.textContent = "";
  const nickname = $("nickname").value.trim();
  if (!nickname) {
    err.textContent = "Nickname can't be empty.";
    return;
  }
  const r = await fetch("/api/me/nickname", {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nickname }),
  });
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    err.textContent = body.detail || "Couldn't save that nickname.";
    return;
  }
  const data = await r.json();
  $("nickname").value = data.nickname;
}

async function loadEuRealms() {
  try {
    const r = await fetch("/api/realms/eu");
    if (!r.ok) return; // not subscribed (402) -- leave both empty
    const data = await r.json();
    realmSearchEntries = data.realms || [];
    // Chip display shows EVERY member name of a connected realm, not just
    // the first (2026-08-02, human report: picked "Todeswache", the chip
    // showed "Der Mithrilorden" -- correct by id, but looked like a bug
    // since the name the user actually searched for vanished). Joined with
    // " / " so it's immediately clear one add covers every name listed.
    const namesById = new Map();
    for (const realm of realmSearchEntries) {
      if (!namesById.has(realm.id)) namesById.set(realm.id, []);
      if (!namesById.get(realm.id).includes(realm.name)) namesById.get(realm.id).push(realm.name);
    }
    realmNameById = new Map([...namesById].map(([id, names]) => [id, names.join(" / ")]));
  } catch (e) { /* leave empty */ }
}

async function loadWowAccounts() {
  try {
    const r = await fetch("/api/wow-accounts");
    if (!r.ok) return [];
    const data = await r.json();
    return data.accounts || [];
  } catch (e) { return []; }
}

// Matches against every member realm name (realmSearchEntries), not just
// each connected realm's primary display name -- so searching "Blackhand"
// finds it even if Blizzard's API returns "Draenor" as that connected
// realm's first/primary name. Each connected-realm id appears at most once
// in the results, keeping whichever member name actually matched (so the
// dropdown shows the name the user searched for, confirming it's the right
// realm) -- picking it registers the whole connected realm regardless of
// which member name was shown, since matching is by id, not name. Sorted
// by the matched name, capped at 8 results -- a search box, not a full list.
function realmSearchMatches(query, excludeIds) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  const seenIds = new Set();
  const matches = [];
  for (const realm of realmSearchEntries) {
    if (excludeIds.has(realm.id) || seenIds.has(realm.id)) continue;
    if (!realm.name.toLowerCase().includes(q)) continue;
    matches.push([realm.id, realm.name]);
    seenIds.add(realm.id);
  }
  matches.sort((a, b) => a[1].localeCompare(b[1]));
  return matches.slice(0, 8);
}

async function refreshWowAccounts() {
  currentAccounts = await loadWowAccounts();
  renderWowAccounts();
}

function renderWowAccounts() {
  $("wow-accounts-loading").style.display = "none";
  const list = $("wow-accounts-list");
  list.style.display = "grid";

  // Distinct realms covered across every account, not a per-account sum --
  // two accounts sharing a realm should still count as one realm covered.
  // Denominator is every distinct EU connected realm (2026-08-02, human
  // idea: "would be fun to add 'coverage counter' -- how many realms do
  // you already have characters on, added to all your accounts").
  const coveredIds = new Set();
  for (const acct of currentAccounts) {
    for (const id of acct.realms) coveredIds.add(id);
  }
  const totalRealms = new Set(realmSearchEntries.map(realm => realm.id)).size;
  const coverageEl = $("realm-coverage");
  if (totalRealms > 0) {
    coverageEl.textContent = `Covering ${coveredIds.size} of ${totalRealms} EU realms.`;
    coverageEl.style.display = "block";
  } else {
    coverageEl.style.display = "none";
  }

  const cards = currentAccounts.map(acct => {
    const excludeIds = new Set(acct.realms);
    const chips = acct.realms.map(id => {
      const name = realmNameById.get(id) || String(id);
      return `<span class="realm-chip">${escapeHtml(name)}<button data-remove-realm="${id}" data-account="${acct.id}" title="Remove realm">&times;</button></span>`;
    }).join("") || `<span class="cap-note">No realms added yet.</span>`;
    const atRealmCap = acct.realms.length >= 50;
    const searchBlock = atRealmCap
      ? `<div class="cap-note">Maximum 50 realms reached.</div>`
      : `<div class="realm-search-wrap">
           <input type="text" class="realm-search-input" placeholder="Search realms..." data-realm-search="${acct.id}" autocomplete="off">
           <div class="realm-search-results" data-realm-results="${acct.id}"></div>
         </div>`;
    return `
      <div class="wow-account-card" data-account-id="${acct.id}">
        <div class="wow-account-card-name-row">
          <input type="text" value="${escapeHtml(acct.label)}" maxlength="50" data-rename-input="${acct.id}">
        </div>
        <div class="cap-note">Press Save to save changes.</div>
        <div class="wow-account-card-actions-row">
          <button data-rename="${acct.id}">Save</button>
          <button class="danger" data-delete="${acct.id}">Remove</button>
        </div>
        <div class="realm-chips">${chips}</div>
        ${searchBlock}
      </div>`;
  }).join("");

  const atAccountCap = currentAccounts.length >= 8;
  const addTile = atAccountCap
    ? `<div class="wow-account-add-card wow-account-add-card--disabled">Maximum 8 WoW accounts reached</div>`
    : `<button class="wow-account-add-card" id="add-account-btn">+ Add account</button>`;

  list.innerHTML = cards + addTile;

  if (!atAccountCap) $("add-account-btn").addEventListener("click", addAccount);
  list.querySelectorAll("[data-rename]").forEach(btn => {
    btn.addEventListener("click", () => renameAccount(Number(btn.dataset.rename)));
  });
  list.querySelectorAll("[data-delete]").forEach(btn => {
    btn.addEventListener("click", () => deleteAccount(Number(btn.dataset.delete)));
  });
  list.querySelectorAll("[data-remove-realm]").forEach(btn => {
    btn.addEventListener("click", () => removeRealm(Number(btn.dataset.account), Number(btn.dataset.removeRealm)));
  });
  list.querySelectorAll("[data-realm-search]").forEach(input => {
    const accountId = Number(input.dataset.realmSearch);
    input.addEventListener("input", () => updateRealmSearchResults(accountId));
    input.addEventListener("focus", () => updateRealmSearchResults(accountId));
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); pickTopRealmMatch(accountId); }
      if (e.key === "Escape") { hideRealmSearchResults(accountId); }
    });
    // Hiding on blur would otherwise race a click on a result item -- see
    // updateRealmSearchResults()'s mousedown comment below.
    input.addEventListener("blur", () => { setTimeout(() => hideRealmSearchResults(accountId), 150); });
  });
}

function hideRealmSearchResults(accountId) {
  const resultsEl = document.querySelector(`[data-realm-results="${accountId}"]`);
  if (resultsEl) resultsEl.style.display = "none";
}

function updateRealmSearchResults(accountId) {
  const input = document.querySelector(`[data-realm-search="${accountId}"]`);
  const resultsEl = document.querySelector(`[data-realm-results="${accountId}"]`);
  if (!input || !resultsEl) return;
  const acct = currentAccounts.find(a => a.id === accountId);
  const excludeIds = new Set(acct ? acct.realms : []);
  if (!input.value.trim()) { resultsEl.style.display = "none"; return; }
  const matches = realmSearchMatches(input.value, excludeIds);
  if (!matches.length) {
    resultsEl.innerHTML = `<div class="realm-search-empty">No matching realm</div>`;
    resultsEl.style.display = "block";
    return;
  }
  resultsEl.innerHTML = matches.map(([id, name]) =>
    `<div class="realm-search-item" data-pick-realm="${id}" data-account="${accountId}">${escapeHtml(name)}</div>`
  ).join("");
  resultsEl.style.display = "block";
  resultsEl.querySelectorAll("[data-pick-realm]").forEach(item => {
    // mousedown, not click -- fires (and completes synchronously) before
    // the search input's own blur handler, so the pick always registers
    // before hideRealmSearchResults() could race the dropdown closed.
    item.addEventListener("mousedown", (e) => {
      e.preventDefault();
      addRealm(Number(item.dataset.account), Number(item.dataset.pickRealm));
    });
  });
}

function pickTopRealmMatch(accountId) {
  const input = document.querySelector(`[data-realm-search="${accountId}"]`);
  if (!input) return;
  const acct = currentAccounts.find(a => a.id === accountId);
  const excludeIds = new Set(acct ? acct.realms : []);
  const matches = realmSearchMatches(input.value, excludeIds);
  if (matches.length) addRealm(accountId, matches[0][0]);
}

async function addAccount() {
  const err = $("wow-accounts-error");
  err.textContent = "";
  // Numbered by default (2026-08-02, human request -- WoW accounts are
  // always 1-8 per Battle.net account, no need to type a name to get
  // started) -- still renameable afterward via the card's own input.
  const label = `Account ${currentAccounts.length + 1}`;
  const r = await fetch("/api/wow-accounts", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ label }),
  });
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    err.textContent = body.detail || "Couldn't add that account.";
    return;
  }
  await refreshWowAccounts();
}

async function renameAccount(accountId) {
  const err = $("wow-accounts-error");
  err.textContent = "";
  const input = document.querySelector(`[data-rename-input="${accountId}"]`);
  const label = input.value.trim();
  if (!label) { err.textContent = "Account name can't be empty."; return; }
  const r = await fetch(`/api/wow-accounts/${accountId}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ label }),
  });
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    err.textContent = body.detail || "Couldn't rename that account.";
    return;
  }
  await refreshWowAccounts();
}

(async function init() {
  const me = await fetch("/api/me").catch(() => null);
  if (!me || !me.ok) { window.location.href = "/login"; return; }
  const data = await me.json();

  $("email").textContent = data.email;
  $("nickname").value = data.nickname || "";
  $("nickname-save").addEventListener("click", saveNickname);
  $("status-badge").innerHTML = badge(data.subscription_status, data.is_superuser);

  if (data.subscription_current_period_end && !data.is_superuser) {
    $("period-end-wrap").style.display = "inline";
    $("period-end").textContent = new Date(data.subscription_current_period_end).toLocaleDateString();
  }

  const actions = $("actions");
  if (data.is_superuser) {
    actions.innerHTML = "";
  } else if (data.subscription_status === "active" || data.has_stripe_customer) {
    actions.innerHTML = `<button id="manage">Manage subscription</button>`;
    $("manage").addEventListener("click", startPortal);
  } else {
    actions.innerHTML = `<a class="btn" href="/subscribe">Subscribe</a>`;
  }

  // WoW Accounts: gated client-side (mirrors the actions div logic just
  // above) since the server 402s anyway. Loading state shown from the
  // moment we know the account is subscribed until both fetches resolve
  // (2026-08-02, human request: "wait on displaying a user's account,
  // until the data is actually loaded") -- never flashes an empty grid or
  // the add-tile before real data is in.
  const subscribed = data.subscription_status === "active" || data.is_superuser;
  if (subscribed) {
    $("wow-accounts-loading").style.display = "grid";
    const results = await Promise.all([loadEuRealms(), loadWowAccounts()]);
    currentAccounts = results[1];
    renderWowAccounts();
  } else {
    $("wow-accounts-upsell").style.display = "block";
    $("wow-accounts-upsell").innerHTML = `Subscribe to register WoW accounts and realms. <a href="/subscribe">See plans &rarr;</a>`;
  }
})();

// Same endpoint/redirect as dashboard.html's #logout button -- this page had
// no way to log out at all before (2026-07-30 human report).
$("nav-logout").addEventListener("click", async () => {
  await fetch("/auth/logout", { method: "POST" }).catch(() => {});
  window.location.href = "/login";
});

function applyThemeButtonState() {
  const dark = document.documentElement.dataset.theme === "dark";
  const btn = $("theme-toggle");
  btn.textContent = dark ? "☀" : "☽";
  const label = dark ? "Switch to light mode" : "Switch to dark mode";
  btn.title = label;
  btn.setAttribute("aria-label", label);
}
$("theme-toggle").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("theme", next);
  applyThemeButtonState();
});
applyThemeButtonState();
</script>
