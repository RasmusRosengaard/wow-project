<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auction House API Log — Realm Arbitrage</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script>
  (function () {
    var saved = localStorage.getItem("theme");
    var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --paper: #f6f7f5;
    --card: #ffffff;
    --hairline: #d8dbd4;
    --hairline-strong: #c3c8bd;
    --ink: #14161a;
    --text-dim: #5b6259;
    --bullion: #a67c2e;
    --bullion-dim: #8a6624;
    --verified: #2f7d72;
    --alert: #b0392f;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #14161a;
    --card: #1b1e24;
    --hairline: #333844;
    --hairline-strong: #454b59;
    --ink: #e8eaed;
    --text-dim: #8b93a3;
    --bullion: #d4af61;
    --bullion-dim: #b8934f;
    --verified: #3fa9a0;
    --alert: #e0645a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: var(--paper); color: var(--ink); min-height: 100vh;
  }
  code, .mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; padding: 0.9rem 1.5rem; background: var(--card);
    border-bottom: 1px solid var(--hairline-strong);
  }
  .brand { display: flex; align-items: center; gap: 0.6rem; }
  .brand h1 {
    font-size: 1.05rem; margin: 0; font-weight: 800; letter-spacing: -0.01em;
    text-transform: uppercase; color: var(--ink);
  }
  .seal { color: var(--verified); flex-shrink: 0; }
  .nav { display: flex; gap: 0.4rem; align-items: center; }
  .nav a, .nav button {
    background: transparent; border: 1px solid transparent; color: var(--text-dim);
    border-radius: 3px; padding: 0.4rem 0.7rem; cursor: pointer; font-size: 0.8rem;
    text-decoration: none; font-weight: 600; font-family: inherit;
  }
  .nav a:hover, .nav button:hover { border-color: var(--hairline-strong); color: var(--ink); }
  #theme-toggle { font-size: 1rem; line-height: 1; padding: 0.4rem 0.55rem; }

  .shell { display: flex; justify-content: center; padding: 2rem 1.5rem; }
  .wrap { max-width: 640px; width: 100%; display: flex; flex-direction: column; gap: 1.1rem; }
  .lede { color: var(--text-dim); font-size: 0.85rem; line-height: 1.5; margin: 0; }
  .card {
    background: var(--card); border: 1px solid var(--hairline); border-radius: 6px;
    padding: 1.25rem; display: flex; flex-direction: column; gap: 0.9rem;
  }
  label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); display: flex; flex-direction: column; gap: 0.35rem; }
  select {
    background: var(--paper); border: 1px solid var(--hairline-strong); color: var(--ink);
    border-radius: 3px; padding: 0.5rem; font-size: 0.9rem; font-family: inherit;
  }
  select:focus-visible { outline: 2px solid var(--bullion); outline-offset: 1px; }
  .summary { font-size: 0.8rem; color: var(--text-dim); }
  .summary strong { color: var(--bullion); font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace; }
  ul#times {
    list-style: none; margin: 0; padding: 0; max-height: 60vh; overflow-y: auto;
    border-top: 1px solid var(--hairline);
  }
  ul#times li {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace; font-size: 0.85rem;
    padding: 0.45rem 0.2rem; border-bottom: 1px solid var(--hairline);
    display: flex; justify-content: space-between; gap: 1rem;
  }
  ul#times li:nth-child(odd) { background: var(--paper); }
  .ago { color: var(--text-dim); font-size: 0.78rem; }
  .empty, .error { color: var(--text-dim); font-size: 0.85rem; padding: 0.5rem 0; }
  .error { color: var(--alert); }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <svg class="seal" width="26" height="26" viewBox="0 0 30 30" aria-hidden="true">
      <circle cx="15" cy="15" r="13" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="15" cy="15" r="10" fill="none" stroke="currentColor" stroke-width="0.6"/>
      <g stroke="currentColor" stroke-width="0.9" stroke-linecap="round">
        <line x1="15" y1="1" x2="15" y2="3.4"/>
        <line x1="15" y1="26.6" x2="15" y2="29"/>
        <line x1="1" y1="15" x2="3.4" y2="15"/>
        <line x1="26.6" y1="15" x2="29" y2="15"/>
        <line x1="5.11" y1="5.11" x2="6.81" y2="6.81"/>
        <line x1="23.19" y1="23.19" x2="24.89" y2="24.89"/>
        <line x1="5.11" y1="24.89" x2="6.81" y2="23.19"/>
        <line x1="23.19" y1="6.81" x2="24.89" y2="5.11"/>
      </g>
      <path d="M9.5 15.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Realm Arbitrage</h1>
  </div>
  <div class="nav">
    <button id="theme-toggle" title="Switch to dark mode" aria-label="Switch to dark mode">&#9789;</button>
    <a href="/">Dashboard</a>
    <a href="/pricing">Pricing</a>
  </div>
</div>
<div class="shell">
<div class="wrap">
  <h2 style="margin:0;font-size:1.1rem;font-weight:800;letter-spacing:-0.01em;">Auction House API Log</h2>
  <p class="lede">Log for when the collector has gotten new AH data from Blizzard.</p>
  <div class="card">
    <label>Realm
      <select id="realm"></select>
    </label>
    <div class="summary" id="summary"></div>
    <ul id="times"></ul>
    <div class="empty" id="empty" style="display:none;">No snapshots recorded for this realm yet.</div>
    <div class="error" id="error" style="display:none;"></div>
  </div>
</div>
</div>
<script>
const $ = (id) => document.getElementById(id);

function timeAgo(seconds) {
  const diff = Math.max(0, Date.now() / 1000 - seconds);
  if (diff < 3600) return `${Math.round(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.round(diff / 3600)}h ago`;
  return `${Math.round(diff / 86400)}d ago`;
}

async function loadRealms() {
  const r = await fetch("/api/log/realms");
  const data = await r.json();
  const sel = $("realm");
  if (!data.realms.length) {
    sel.innerHTML = `<option>no realms collected yet</option>`;
    sel.disabled = true;
    return null;
  }
  sel.innerHTML = data.realms.map(re => `<option value="${re.id}">${re.name}</option>`).join("");
  return data.realms[0].id;
}

async function loadLog(sell) {
  $("error").style.display = "none";
  const r = await fetch(`/api/log?sell=${encodeURIComponent(sell)}`);
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    $("error").textContent = body.detail || "Couldn't load the log for this realm.";
    $("error").style.display = "block";
    $("summary").textContent = "";
    $("times").innerHTML = "";
    $("empty").style.display = "none";
    return;
  }
  const data = await r.json();
  $("summary").innerHTML = `<strong>${data.count}</strong> new-data retrievals recorded for ${data.realm_name}`;
  $("empty").style.display = data.timestamps.length ? "none" : "block";
  $("times").innerHTML = data.timestamps.map(ts => `
    <li>
      <span>${new Date(ts * 1000).toLocaleString()}</span>
      <span class="ago">${timeAgo(ts)}</span>
    </li>
  `).join("");
}

(async function init() {
  const first = await loadRealms();
  if (first == null) return;
  await loadLog(first);
  $("realm").addEventListener("change", (e) => loadLog(e.target.value));
})();

function applyThemeButtonState() {
  const dark = document.documentElement.dataset.theme === "dark";
  const btn = $("theme-toggle");
  btn.textContent = dark ? "☀" : "☽";
  const label = dark ? "Switch to light mode" : "Switch to dark mode";
  btn.title = label;
  btn.setAttribute("aria-label", label);
}
$("theme-toggle").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("theme", next);
  applyThemeButtonState();
});
applyThemeButtonState();
</script>
</body>
</html>
