<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Register — AH Snipe Dashboard</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14170f; --panel: #1b1f15; --panel-raised: #23281a;
    --border: #3a4029; --border-bright: #565f38;
    --text: #eef0e6; --text-dim: #97a084;
    --toxic: #a6e600; --toxic-dim: #7fb300; --brass: #c9963e; --ember: #ff7a45;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    background-image: radial-gradient(ellipse at top, rgba(166,230,0,0.05), transparent 60%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 1rem;
  }
  form {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 2rem; width: 100%; max-width: 320px;
    display: flex; flex-direction: column; gap: 1rem;
  }
  h1 {
    font-size: 1.15rem; margin: 0 0 0.3rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: -0.01em;
  }
  label {
    font-size: 0.72rem; color: var(--text-dim); display: flex; flex-direction: column;
    gap: 0.35rem; text-transform: uppercase; letter-spacing: 0.05em;
  }
  input {
    background: var(--bg); border: 1px solid var(--border-bright); color: var(--text);
    border-radius: 3px; padding: 0.55rem 0.65rem; font-size: 0.9rem; font-family: inherit;
  }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--toxic); outline-offset: 1px; }
  button {
    background: var(--toxic); border: 1px solid var(--toxic); color: #0f1400;
    border-radius: 3px; padding: 0.6rem; cursor: pointer; font-size: 0.85rem;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; margin-top: 0.2rem;
  }
  button:hover { background: var(--toxic-dim); border-color: var(--toxic-dim); }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { color: var(--ember); font-size: 0.8rem; min-height: 1em; }
  .switch { font-size: 0.8rem; color: var(--text-dim); text-align: center; }
  .switch a { color: var(--brass); }
</style>
</head>
<body>
<form id="form">
  <h1>Create account</h1>
  <label>Email <input type="email" id="email" required autocomplete="username"></label>
  <label>Password <input type="password" id="password" required autocomplete="new-password" minlength="8"></label>
  <div id="error" class="error"></div>
  <button type="submit" id="submit">Register</button>
  <div class="switch">Already have an account? <a href="/login">Log in</a></div>
</form>
<script>
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submit");
  const err = document.getElementById("error");
  err.textContent = "";
  btn.disabled = true;
  try {
    const r = await fetch("/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      }),
    });
    if (r.ok) {
      // Registered but not logged in yet -- FastAPI-Users doesn't auto-login
      // on register; send them to log in with their new credentials.
      window.location.href = "/login";
      return;
    }
    const data = await r.json().catch(() => ({}));
    const detail = data.detail;
    if (detail === "REGISTER_USER_ALREADY_EXISTS") {
      err.textContent = "An account with that email already exists.";
    } else if (detail && typeof detail === "object" && detail.code === "REGISTER_INVALID_PASSWORD") {
      err.textContent = detail.reason || "Password doesn't meet requirements.";
    } else {
      err.textContent = "Registration failed -- try again.";
    }
  } catch (e) {
    err.textContent = "Network error -- try again.";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
