<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password — Realm Arbitrage</title>
<!-- noindex, nofollow: same token-in-the-query reasoning as /verify. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script>
  (function () {
    var saved = localStorage.getItem("theme");
    var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --paper: #f6f7f5;
    --card: #ffffff;
    --hairline: #d8dbd4;
    --hairline-strong: #c3c8bd;
    --ink: #14161a;
    --text-dim: #5b6259;
    --bullion: #a67c2e;
    --bullion-dim: #8a6624;
    --verified: #2f7d72;
    --alert: #b0392f;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #14161a;
    --card: #1b1e24;
    --hairline: #333844;
    --hairline-strong: #454b59;
    --ink: #e8eaed;
    --text-dim: #8b93a3;
    --bullion: #d4af61;
    --bullion-dim: #b8934f;
    --verified: #3fa9a0;
    --alert: #e0645a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--paper); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 1.5rem; gap: 1.5rem;
  }
  .brand { display: flex; align-items: center; gap: 0.6rem; }
  .brand-link { display: contents; text-decoration: none; color: inherit; }
  .brand h1 {
    font-size: 1rem; margin: 0; font-weight: 800; letter-spacing: -0.01em;
    text-transform: uppercase; color: var(--ink);
  }
  .seal { --coin: var(--bullion); --line: var(--ink); flex-shrink: 0; }
  /* The mark is two-tone now, so it drives --coin/--line instead of a
     single `color`. It was var(--verified) teal while the product
     claimed to certify a price; pricing became a listing-to-listing
     comparison in July, so the seal no longer had a claim to make. */
  #theme-toggle {
    position: fixed; top: 1rem; right: 1rem;
    background: var(--card); border: 1px solid var(--hairline-strong); color: var(--text-dim);
    border-radius: 3px; padding: 0.4rem 0.55rem; cursor: pointer; font-size: 1rem; line-height: 1;
    font-family: inherit;
  }
  #theme-toggle:hover { color: var(--ink); border-color: var(--bullion); }
  form, .panel {
    background: var(--card); border: 1px solid var(--hairline); border-radius: 6px;
    padding: 2rem; width: 100%; max-width: 320px;
    display: flex; flex-direction: column; gap: 1rem;
  }
  .panel h2 {
    font-size: 0.95rem; margin: 0; color: var(--ink);
    display: flex; align-items: center; gap: 0.5rem;
  }
  .panel p, .lede { font-size: 0.83rem; color: var(--text-dim); margin: 0; line-height: 1.55; }
  .mark { font-size: 1.1rem; line-height: 1; }
  .mark.ok { color: var(--verified); }
  .mark.bad { color: var(--alert); }
  label {
    font-size: 0.68rem; color: var(--text-dim); display: flex; flex-direction: column;
    gap: 0.35rem; text-transform: uppercase; letter-spacing: 0.05em;
  }
  input {
    background: var(--paper); border: 1px solid var(--hairline-strong); color: var(--ink);
    border-radius: 3px; padding: 0.55rem 0.65rem; font-size: 0.9rem; font-family: inherit;
  }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--bullion); outline-offset: 1px; }
  button {
    background: var(--bullion); border: 1px solid var(--bullion); color: #fff;
    border-radius: 3px; padding: 0.6rem; cursor: pointer; font-size: 0.85rem;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; margin-top: 0.2rem;
    font-family: inherit;
  }
  button:hover { background: var(--bullion-dim); border-color: var(--bullion-dim); }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { color: var(--alert); font-size: 0.8rem; min-height: 1em; }
  .switch { font-size: 0.8rem; color: var(--text-dim); text-align: center; }
  .switch a { color: var(--bullion); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<button id="theme-toggle" title="Switch to dark mode" aria-label="Switch to dark mode">&#9789;</button>
<div class="brand">
  <a href="/" class="brand-link" aria-label="Realm Arbitrage home">
  <svg class="seal" width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
    <!-- A struck gold coin held in a sniper's reticle (replaced the ring-and-check
         seal 2026-08-11). The crosshair arms and the centre are cut OUT of the coin
         through a mask rather than painted in the page's own background colour --
         the knockouts are genuinely transparent, so this one block works on the
         topbar (--card), on the bare auth pages (--paper) and in both themes
         without having to know what sits behind it. -->
    <defs>
      <mask id="seal-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
        <rect width="32" height="32" fill="#fff"/>
        <!-- mid-grey = a partial cut, so the struck inner ring reads as milled
             into the coin instead of punched clean through it -->
        <circle cx="16" cy="16" r="6.4" fill="none" stroke="#7a7a7a" stroke-width="0.7"/>
        <g stroke="#000" stroke-width="1.5" stroke-linecap="round">
          <line x1="16" y1="6" x2="16" y2="12.4"/>
          <line x1="16" y1="19.6" x2="16" y2="26"/>
          <line x1="6" y1="16" x2="12.4" y2="16"/>
          <line x1="19.6" y1="16" x2="26" y2="16"/>
        </g>
        <circle cx="16" cy="16" r="1.5" fill="#000"/>
      </mask>
    </defs>
    <circle cx="16" cy="16" r="12.2" fill="none" stroke="var(--line)" stroke-width="0.9" opacity="0.55"/>
    <circle cx="16" cy="16" r="9" fill="var(--coin)" mask="url(#seal-cut)"/>
    <g stroke="var(--line)" stroke-width="1.5" stroke-linecap="round">
      <line x1="16" y1="1.5" x2="16" y2="6.2"/>
      <line x1="16" y1="25.8" x2="16" y2="30.5"/>
      <line x1="1.5" y1="16" x2="6.2" y2="16"/>
      <line x1="25.8" y1="16" x2="30.5" y2="16"/>
    </g>
  </svg>
  <h1>Realm Arbitrage</h1>
  </a>
</div>
<form id="form">
  <p class="lede">Choose a new password for your account.</p>
  <label>New password
    <input type="password" id="password" required autocomplete="new-password" minlength="8">
  </label>
  <label>Confirm new password
    <input type="password" id="confirm" required autocomplete="new-password" minlength="8">
  </label>
  <div id="error" class="error"></div>
  <button type="submit" id="submit">Set new password</button>
  <div class="switch"><a href="/login">Back to log in</a></div>
</form>
<div class="panel" id="ok" hidden>
  <h2><span class="mark ok">&#10003;</span> Password updated</h2>
  <p>Your new password is active. Log in with it now.</p>
  <div class="switch"><a href="/login">Log in</a></div>
</div>
<!-- Shown when the link itself is unusable, so there's no point rendering a
     form the user can't submit. A bad and an expired token get the same panel:
     the remedy is identical, and distinguishing them would tell a stranger
     whether a token was ever real. -->
<div class="panel" id="bad" hidden>
  <h2><span class="mark bad">&#10007;</span> That link didn't work</h2>
  <p id="bad-why">Reset links expire after an hour and can only be used once.
     Request a fresh one.</p>
  <div class="switch"><a href="/forgot-password">Request a new link</a></div>
</div>
<script>
const token = new URLSearchParams(window.location.search).get("token");

function show(id) {
  for (const p of ["form", "ok", "bad"]) {
    document.getElementById(p).hidden = (p !== id);
  }
}

// No token means this page was opened directly rather than from an email --
// don't show a password form that can only fail on submit.
if (!token) {
  document.getElementById("bad-why").textContent =
    "This page needs a reset link from your email. Request one to get started.";
  show("bad");
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submit");
  const err = document.getElementById("error");
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  err.textContent = "";
  // Checked here rather than server-side because there is no server-side to
  // check it against -- /auth/reset-password takes a single password. This is
  // purely a typo guard for the user's benefit.
  if (password !== confirm) {
    err.textContent = "The two passwords don't match.";
    return;
  }
  btn.disabled = true;
  try {
    const r = await fetch("/auth/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, password }),
    });
    if (r.ok) {
      show("ok");
      return;
    }
    const data = await r.json().catch(() => ({}));
    const detail = data.detail;
    // RESET_PASSWORD_INVALID_PASSWORD carries a `reason` from the password
    // validator and is worth showing verbatim -- the user can act on it. A bad
    // token is not a form problem, so it replaces the whole panel instead.
    if (detail && typeof detail === "object" && detail.code === "RESET_PASSWORD_INVALID_PASSWORD") {
      err.textContent = detail.reason || "That password doesn't meet requirements.";
      btn.disabled = false;
      return;
    }
    show("bad");
  } catch (e) {
    err.textContent = "Network error -- try again.";
    btn.disabled = false;
  }
});

function applyThemeButtonState() {
  const dark = document.documentElement.dataset.theme === "dark";
  const btn = document.getElementById("theme-toggle");
  btn.textContent = dark ? "☀" : "☽";
  const label = dark ? "Switch to light mode" : "Switch to dark mode";
  btn.title = label;
  btn.setAttribute("aria-label", label);
}
document.getElementById("theme-toggle").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("theme", next);
  applyThemeButtonState();
});
applyThemeButtonState();
</script>
</body>
</html>
