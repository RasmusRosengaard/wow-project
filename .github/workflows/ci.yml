name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # auth.py hard-fails at import time if SECRET is unset (fail-fast is
      # correct for production, but the test suite needs *something* here --
      # it's never used to sign anything real, tests override the DB with
      # SQLite and never talk to production Stripe/Blizzard/Postgres).
      SECRET: ci-test-secret-not-used-for-anything-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: pytest -q
